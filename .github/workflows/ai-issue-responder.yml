name: AI Issue 自动回复
on:
  issues:
    types: [opened, edited]  # 新建或编辑Issue时触发

jobs:
  reply:
    runs-on: ubuntu-latest
    permissions:
      issues: write  # 必须权限：评论Issue
    steps:
      - name: DeepSeek AI 分析并回复
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const issueNumber = context.issue.number;
            const title = context.payload.issue.title || "无标题";
            const body = context.payload.issue.body || "无内容";

            // 调用 DeepSeek AI
            const res = await fetch("https://api.deepseek.com/chat/completions", {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                "Authorization": `Bearer ${process.env.DEEPSEEK_API_KEY}`
              },
              body: JSON.stringify({
                model: "deepseek-chat",
                temperature: 0.4,
                messages: [{
                  role: "user",
                  content: `用户提交了一个Issue，请给出友好、简洁、有用的回复。不要使用markdown格式。
标题：${title}
内容：${body}`
                }]
              })
            });

            const json = await res.json();
            const aiResponse = json.choices?.[0]?.message?.content || "AI 暂时无法回复，请稍后重试。";
            
            // 固定免责声明
            const footer = "\n\n---\n以下为AI意见，不代表项目维护者意见，已通知项目维护者，请耐心等待回复";

            // 发布评论
            await github.rest.issues.createComment({
              owner, repo, issue_number: issueNumber,
              body: "🤖 AI 自动回复：\n\n" + aiResponse + footer
            });

        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}