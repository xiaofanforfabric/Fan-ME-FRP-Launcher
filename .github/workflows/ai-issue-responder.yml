name: AI Issue 自动回复
on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created, edited]

jobs:
  reply:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: DeepSeek AI 自动回复
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const issueNumber = context.issue.number;
            let userContent = "";

            // 判断是 Issue 还是评论
            if (context.payload.comment) {
              userContent = context.payload.comment.body;
            } else {
              userContent = context.payload.issue.body || "无内容";
            }

            // 调用 AI
            const res = await fetch("https://api.deepseek.com/chat/completions", {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                "Authorization": `Bearer ${process.env.DEEPSEEK_API_KEY}`
              },
              body: JSON.stringify({
                model: "deepseek-chat",
                temperature: 0.4,
                messages: [{
                  role: "user",
                  content: "请回答用户的问题：\n" + userContent
                }]
              })
            });

            const json = await res.json();
            const aiResponse = json.choices?.[0]?.message?.content || "AI 暂时无法回复，请稍后重试。";
            const footer = "\n\n---\n以下为AI意见，不代表项目维护者意见，已通知项目维护者，请耐心等待回复";

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: issueNumber,
              body: "🤖 AI 自动回复：\n\n" + aiResponse + footer
            });
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}