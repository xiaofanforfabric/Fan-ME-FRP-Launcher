<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>403 Forbidden</title>
    <style type="text/css">
        * {
            margin: 0;
            padding: 0;
        }
        html, body {
            width: 100%;
            height: 100%;
            background-color: #cc0000;
            font-family: "Microsoft YaHei", Arial, sans-serif;
        }
        .container {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 500px;
            height: 300px;
            margin-left: -250px;
            margin-top: -150px;
            text-align: center;
            color: #ffffff;
        }
        .code {
            font-size: 120px;
            font-weight: bold;
            line-height: 1;
        }
        .title {
            font-size: 28px;
            margin-top: 10px;
        }
        .desc {
            font-size: 16px;
            margin-top: 20px;
            opacity: 0.9;
        }
        .divider {
            width: 60px;
            height: 3px;
            background-color: #ffffff;
            margin: 20px auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="code">403</div>
        <div class="divider"></div>
        <div class="title">&#x65E0;&#x6743;&#x8BBF;&#x95EE;</div>
        <div class="desc">Forbidden - Access Denied</div>
    </div>
</body>
</html>
