<!DOCTYPE html>
<html lang="zh-CN" data-theme="colorful-black">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Fan-ME-FRP</title>
<style>
/* 默认主题：明亮 (Light) */
:root {
    --bg-base: #f4f5f7; --glass-bg: rgba(255, 255, 255, 0.45); --glass-border: rgba(255, 255, 255, 0.5); --glass-highlight: rgba(255, 255, 255, 0.8); --glass-shadow: rgba(0, 0, 0, 0.08);
    --text-main: #1d1d1f; --text-sec: #86868b; --primary: #0071e3; --primary-hover: #0077ed; --primary-light: rgba(0, 113, 227, 0.12);
    --blob-1: rgba(0, 113, 227, 0.15); --blob-2: rgba(0, 200, 255, 0.15); --blob-3: rgba(120, 0, 255, 0.1); --blob-4: rgba(255, 45, 85, 0.1);
    --spring: cubic-bezier(0.34, 1.56, 0.64, 1); --spring-smooth: cubic-bezier(0.25, 1, 0.3, 1); --duration: 0.6s;
    --nav-width: 280px; --nav-collapsed-width: 84px; --mx: 0px; --my: 0px;
}

/* 优雅正经的：五彩斑斓黑 */
[data-theme="colorful-black"] {
    --bg-base: #050508; --glass-bg: rgba(20, 20, 25, 0.35); --glass-border: rgba(255, 255, 255, 0.06); --glass-highlight: rgba(255, 255, 255, 0.02); --glass-shadow: rgba(0, 0, 0, 0.8);
    --text-main: #e8e8ed; --text-sec: #8a8a93; --primary: #4a6fff; --primary-hover: #6b8aff; --primary-light: rgba(74, 111, 255, 0.15);
    --blob-1: rgba(74, 111, 255, 0.25); --blob-2: rgba(138, 43, 226, 0.2); --blob-3: rgba(0, 210, 255, 0.15); --blob-4: rgba(255, 45, 85, 0.15);
}

/* 其他 7 套主题 */
[data-theme="dark"] { --bg-base: #000000; --glass-bg: rgba(30, 30, 35, 0.35); --glass-border: rgba(255, 255, 255, 0.15); --glass-highlight: rgba(255, 255, 255, 0.05); --glass-shadow: rgba(0, 0, 0, 0.6); --text-main: #f5f5f7; --text-sec: #a1a1a6; --primary: #32d74b; --primary-hover: #2fd146; --primary-light: rgba(50, 215, 75, 0.15); --blob-1: rgba(50, 215, 75, 0.2); --blob-2: rgba(10, 132, 255, 0.2); --blob-3: rgba(94, 92, 230, 0.15); --blob-4: rgba(255, 159, 10, 0.1); }
[data-theme="warm"] { --bg-base: #fdf6f0; --glass-bg: rgba(255, 248, 240, 0.45); --glass-border: rgba(255, 255, 255, 0.6); --glass-highlight: rgba(255, 255, 255, 0.9); --glass-shadow: rgba(139, 94, 52, 0.08); --text-main: #4a3b32; --text-sec: #9e8e82; --primary: #d97706; --primary-hover: #f59e0b; --primary-light: rgba(217, 119, 6, 0.12); --blob-1: rgba(255, 149, 0, 0.15); --blob-2: rgba(255, 204, 0, 0.15); --blob-3: rgba(255, 59, 48, 0.1); --blob-4: rgba(175, 82, 222, 0.1); }
[data-theme="cool"] { --bg-base: #080b12; --glass-bg: rgba(20, 30, 45, 0.35); --glass-border: rgba(255, 255, 255, 0.1); --glass-highlight: rgba(255, 255, 255, 0.05); --glass-shadow: rgba(0, 0, 0, 0.6); --text-main: #f8fafc; --text-sec: #94a3b8; --primary: #06b6d4; --primary-hover: #22d3ee; --primary-light: rgba(6, 182, 212, 0.15); --blob-1: rgba(100, 210, 255, 0.2); --blob-2: rgba(10, 132, 255, 0.2); --blob-3: rgba(191, 90, 242, 0.15); --blob-4: rgba(94, 92, 230, 0.15); }
[data-theme="midnight"] { --bg-base: #050510; --glass-bg: rgba(15, 15, 30, 0.4); --glass-border: rgba(255, 255, 255, 0.08); --glass-highlight: rgba(255, 255, 255, 0.03); --glass-shadow: rgba(0, 0, 0, 0.7); --text-main: #e2e2ea; --text-sec: #7e7e8f; --primary: #5e5ce6; --primary-hover: #7d7aff; --primary-light: rgba(94, 92, 230, 0.15); --blob-1: rgba(94, 92, 230, 0.25); --blob-2: rgba(191, 90, 242, 0.2); --blob-3: rgba(10, 132, 255, 0.15); --blob-4: rgba(255, 55, 95, 0.1); }
[data-theme="forest"] { --bg-base: #0a110a; --glass-bg: rgba(20, 35, 20, 0.35); --glass-border: rgba(255, 255, 255, 0.1); --glass-highlight: rgba(255, 255, 255, 0.05); --glass-shadow: rgba(0, 0, 0, 0.5); --text-main: #f0f7f0; --text-sec: #8fbc8f; --primary: #00c7be; --primary-hover: #00e0d6; --primary-light: rgba(0, 199, 190, 0.15); --blob-1: rgba(0, 199, 190, 0.2); --blob-2: rgba(50, 215, 75, 0.2); --blob-3: rgba(255, 204, 0, 0.15); --blob-4: rgba(0, 113, 227, 0.1); }
[data-theme="sunset"] { --bg-base: #1a0810; --glass-bg: rgba(40, 20, 30, 0.35); --glass-border: rgba(255, 255, 255, 0.12); --glass-highlight: rgba(255, 255, 255, 0.06); --glass-shadow: rgba(0, 0, 0, 0.6); --text-main: #ffe4eb; --text-sec: #b08a95; --primary: #ff2d55; --primary-hover: #ff4a6e; --primary-light: rgba(255, 45, 85, 0.15); --blob-1: rgba(255, 45, 85, 0.25); --blob-2: rgba(255, 149, 0, 0.2); --blob-3: rgba(175, 82, 222, 0.15); --blob-4: rgba(255, 204, 0, 0.15); }
[data-theme="ocean"] { --bg-base: #041015; --glass-bg: rgba(15, 35, 45, 0.35); --glass-border: rgba(255, 255, 255, 0.1); --glass-highlight: rgba(255, 255, 255, 0.05); --glass-shadow: rgba(0, 0, 0, 0.6); --text-main: #e0f4fc; --text-sec: #7aa5b5; --primary: #32ade6; --primary-hover: #4ec0f5; --primary-light: rgba(50, 173, 230, 0.15); --blob-1: rgba(50, 173, 230, 0.25); --blob-2: rgba(0, 199, 190, 0.2); --blob-3: rgba(10, 132, 255, 0.15); --blob-4: rgba(94, 92, 230, 0.1); }

/* 全局彻底禁用选中与右击拖动 */
* { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; -webkit-tap-highlight-color: transparent; }
body { 
    background: var(--bg-base); color: var(--text-main); overflow: hidden; 
    /* 核心：禁止选中文字和拖动图片等 */
    user-select: none; -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; -webkit-user-drag: none;
}
input { user-select: auto; -webkit-user-select: auto; -moz-user-select: auto; -ms-user-select: auto; }

/* 静态渐变背景 */
.bg-container { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1; pointer-events: none; overflow: hidden; }
/* 去除之前平庸的 transition，让底色在冲击波遮蔽时“瞬间”重构 */
.blob { position: absolute; border-radius: 50%; will-change: transform; }
.blob:nth-child(1) { width: 120vw; height: 120vw; top: -20vh; left: -10vw; background: radial-gradient(circle, var(--blob-1) 0%, transparent 60%); animation: drift1 30s infinite alternate ease-in-out; }
.blob:nth-child(2) { width: 100vw; height: 100vw; bottom: -20vh; right: -20vw; background: radial-gradient(circle, var(--blob-2) 0%, transparent 60%); animation: drift2 35s infinite alternate ease-in-out; }
.blob:nth-child(3) { width: 90vw; height: 90vw; top: 30vh; left: 40vw; background: radial-gradient(circle, var(--blob-3) 0%, transparent 60%); animation: drift3 40s infinite alternate ease-in-out; }
.blob:nth-child(4) { width: 80vw; height: 80vw; bottom: 10vh; left: -10vw; background: radial-gradient(circle, var(--blob-4) 0%, transparent 60%); animation: drift4 28s infinite alternate ease-in-out; }

@keyframes drift1 { 0% { transform: translate3d(0, 0, 0) scale(1); } 100% { transform: translate3d(15vw, 10vh, 0) scale(1.1); } }
@keyframes drift2 { 0% { transform: translate3d(0, 0, 0) scale(1); } 100% { transform: translate3d(-10vw, -15vh, 0) scale(1.2); } }
@keyframes drift3 { 0% { transform: translate3d(0, 0, 0) scale(1); } 100% { transform: translate3d(-15vw, 5vh, 0) scale(0.9); } }
@keyframes drift4 { 0% { transform: translate3d(0, 0, 0) scale(1); } 100% { transform: translate3d(10vw, -10vh, 0) scale(1.15); } }

/* FH5 冲击波扭曲动画层 */
.app-wrapper {
    width: 100vw; height: 100vh; display: flex; position: relative; perspective: 1000px;
    /* 关键：UI层的时空扭曲过渡 */
    transition: transform 0.5s cubic-bezier(0.19, 1, 0.22, 1), filter 0.5s cubic-bezier(0.19, 1, 0.22, 1);
}
/* 冲击波过境时的动态模糊与后坐力 */
.app-wrapper.fh5-warping {
    transform: scale(0.95);
    filter: blur(10px) brightness(1.2);
}

/* UI 亚克力面板 */
.navbar, .card {
    background: var(--glass-bg); backdrop-filter: blur(20px) saturate(180%); -webkit-backdrop-filter: blur(20px) saturate(180%);
    border: 1px solid var(--glass-border); box-shadow: 0 10px 40px var(--glass-shadow); will-change: transform;
    /* 去除面板慢悠悠的渐变，配合冲击波瞬间重构 */
}

.navbar { position: absolute; z-index: 100; display: flex; border-radius: 32px; transition: width 0.4s ease, height 0.4s ease; transform: translate3d(calc(var(--mx) * -0.5), calc(var(--my) * -0.5), 0); }
.app-wrapper.nav-top .navbar { top: 24px; left: 24px; right: 24px; height: 76px; width: calc(100vw - 48px); flex-direction: row; align-items: center; justify-content: space-between; padding: 0 28px; }
.app-wrapper.nav-side .navbar { top: 24px; left: 24px; bottom: 24px; width: var(--nav-width); height: calc(100vh - 48px); flex-direction: column; padding: 36px 24px; }
.app-wrapper.nav-side.collapsed .navbar { width: var(--nav-collapsed-width); padding: 36px 14px; }

.nav-header { display: flex; align-items: center; justify-content: space-between; width: 100%; transition: all var(--duration) var(--spring-smooth); height: 44px; }
.app-wrapper.nav-top .nav-header { width: auto; }
.logo-container { display: flex; align-items: center; gap: 14px; overflow: hidden; height: 100%; }
.logo-icon { width: 40px; height: 40px; border-radius: 14px; background: var(--primary); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 20px; flex-shrink: 0; box-shadow: 0 4px 16px var(--primary-light); }
.logo-text { font-size: 22px; font-weight: 700; white-space: nowrap; transition: opacity 0.3s, width 0.3s; width: 90px; opacity: 1; letter-spacing: -0.5px; }
.app-wrapper.nav-side.collapsed .logo-text { width: 0; opacity: 0; }

.toggle-btn { background: rgba(120, 120, 128, 0.12); border: none; color: var(--text-sec); cursor: pointer; display: none; align-items: center; justify-content: center; width: 36px; height: 36px; border-radius: 12px; transition: all 0.3s ease; flex-shrink: 0; }
.app-wrapper.nav-side .toggle-btn { display: flex; }
.toggle-btn:hover { background: var(--primary-light); color: var(--primary); }
.toggle-btn svg { width: 22px; height: 22px; fill: currentColor; }
.app-wrapper.nav-side.collapsed .toggle-btn { margin: 0 auto; }
.app-wrapper.nav-side.collapsed .toggle-btn svg { transform: rotate(180deg); }

.nav-links { display: flex; gap: 8px; transition: all var(--duration) ease; }
.app-wrapper.nav-top .nav-links { flex-direction: row; position: absolute; left: 50%; transform: translateX(-50%); }
.app-wrapper.nav-side .nav-links { flex-direction: column; margin-top: 48px; width: 100%; }

.nav-item { display: flex; align-items: center; padding: 14px; border-radius: 18px; text-decoration: none; color: var(--text-sec); font-weight: 600; font-size: 16px; transition: all 0.2s ease; overflow: hidden; }
.nav-item:hover, .nav-item.active { background: var(--primary-light); color: var(--primary); }
.icon-wrap { width: 26px; height: 26px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.icon-wrap svg { width: 24px; height: 24px; fill: currentColor; }
.nav-text { margin-left: 16px; white-space: nowrap; opacity: 1; width: 100%; transition: opacity 0.2s; }
.app-wrapper.nav-side.collapsed .nav-item { justify-content: center; padding: 14px 0; }
.app-wrapper.nav-side.collapsed .nav-text { width: 0; opacity: 0; margin-left: 0; }

.info-group { margin-top: auto; margin-bottom: 28px; display: flex; flex-direction: column; gap: 12px; transition: opacity 0.3s; }
.app-wrapper.nav-top .info-group { display: none; }
.app-wrapper.nav-side.collapsed .info-group { opacity: 0; pointer-events: none; height: 0; margin: 0; overflow: hidden; }

.info-box { background: rgba(120, 120, 128, 0.08); border-radius: 20px; cursor: pointer; transition: all 0.3s ease; padding: 16px 20px; border: 1px solid var(--glass-border); position: relative; }
.info-box:hover { background: var(--primary-light); border-color: transparent; }
.weather-main { font-size: 20px; font-weight: 700; color: var(--text-main); display: flex; align-items: center; gap: 6px; }
.weather-main span { font-size: 14px; color: var(--text-sec); font-weight: 600; }
.weather-sub { font-size: 12px; color: var(--text-sec); margin-top: 6px; font-weight: 500; display: flex; align-items: center; justify-content: space-between; }
.weather-hint { opacity: 0.6; font-size: 10px; }
.hitokoto-text { font-size: 13px; line-height: 1.6; color: var(--text-main); font-weight: 500; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.hitokoto-author { font-size: 12px; color: var(--text-sec); text-align: right; margin-top: 8px; font-weight: 500; }

.nav-actions { display: flex; gap: 8px; position: relative; }
.app-wrapper.nav-top .nav-actions { flex-direction: row; }
.app-wrapper.nav-side .nav-actions { flex-direction: column; width: 100%; }

.action-btn { background: transparent; border: none; color: var(--text-sec); padding: 14px; border-radius: 18px; cursor: pointer; display: flex; align-items: center; transition: all 0.2s ease; }
.action-btn:hover { background: rgba(120, 120, 128, 0.12); color: var(--text-main); }
.app-wrapper.nav-side.collapsed .action-btn { justify-content: center; padding: 14px 0; }
.action-text { margin-left: 16px; font-size: 16px; font-weight: 600; white-space: nowrap; text-align: left; }
.app-wrapper.nav-top .action-text, .app-wrapper.nav-side.collapsed .action-text { display: none; }

.theme-popover { position: absolute; background: var(--glass-bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid var(--glass-border); box-shadow: 0 10px 40px rgba(0,0,0,0.15); border-radius: 20px; padding: 16px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; opacity: 0; pointer-events: none; transform: scale(0.9) translateY(5px); transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); z-index: 200; }
.theme-popover.show { opacity: 1; pointer-events: auto; transform: scale(1) translateY(0); }
.app-wrapper.nav-side .theme-popover { bottom: 0; left: calc(100% + 16px); }
.app-wrapper.nav-top .theme-popover { top: calc(100% + 16px); right: 0; }

.theme-dot { width: 32px; height: 32px; border-radius: 50%; cursor: pointer; border: 2px solid rgba(255,255,255,0.2); box-shadow: inset 0 2px 4px rgba(255,255,255,0.3), 0 4px 8px rgba(0,0,0,0.1); transition: all 0.2s; position: relative; }
.theme-dot::after { content: ''; position: absolute; top: -4px; left: -4px; right: -4px; bottom: -4px; border-radius: 50%; border: 2px solid transparent; transition: all 0.2s; }
.theme-dot:hover { transform: scale(1.15); box-shadow: inset 0 2px 4px rgba(255,255,255,0.4), 0 6px 12px rgba(0,0,0,0.2); }
.theme-dot.active { transform: scale(1.15); }
.theme-dot.active::after { border-color: var(--primary); }

.content { flex: 1; display: flex; align-items: center; justify-content: center; transition: padding 0.4s ease; padding: 32px; position: relative; z-index: 10; transform-style: preserve-3d; }
.app-wrapper.nav-top .content { padding-top: 124px; }
.app-wrapper.nav-side .content { padding-left: calc(var(--nav-width) + 48px); }
.app-wrapper.nav-side.collapsed .content { padding-left: calc(var(--nav-collapsed-width) + 48px); }

.card { border-radius: 36px; padding: 48px 40px; width: 100%; max-width: 440px; transform: translate3d(calc(var(--mx) * 1.5), calc(var(--my) * 1.5), 0) rotateX(calc(var(--my) * -0.1deg)) rotateY(calc(var(--mx) * 0.1deg)); }

.card-header { text-align: center; margin-bottom: 40px; }
.card-title { font-size: 28px; font-weight: 700; margin-bottom: 10px; }
.card-subtitle { color: var(--text-sec); font-size: 15px; font-weight: 500; }

.input-wrapper { margin-bottom: 24px; }
.input-field { width: 100%; padding: 18px 20px; border-radius: 16px; border: 1px solid var(--glass-border); background: rgba(120, 120, 128, 0.08); color: var(--text-main); font-size: 16px; outline: none; transition: all 0.3s ease; font-weight: 500; }
.input-field:focus { border-color: var(--primary); background: transparent; box-shadow: 0 0 0 3px var(--primary-light); }

.submit-btn { width: 100%; padding: 18px; border-radius: 16px; border: none; background: var(--primary); color: #fff; font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.3s ease; display: flex; align-items: center; justify-content: center; }
.submit-btn:hover { background: var(--primary-hover); transform: translateY(-2px); box-shadow: 0 8px 20px var(--primary-light); }

/* Tab 切换栏 */
.tab-bar {
    display: flex;
    gap: 8px;
    margin-bottom: 32px;
    background: rgba(120, 120, 128, 0.08);
    border-radius: 16px;
    padding: 4px;
}
.tab-btn {
    flex: 1;
    padding: 12px 16px;
    border: none;
    border-radius: 12px;
    background: transparent;
    color: var(--text-sec);
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s ease;
}
.tab-btn.active {
    background: var(--primary);
    color: #fff;
    box-shadow: 0 4px 12px var(--primary-light);
}
.tab-btn:hover:not(.active) {
    background: var(--primary-light);
    color: var(--primary);
}

/* 登录表单切换 */
.login-form {
    display: none;
}
.login-form.active {
    display: block;
}

/* 人机验证码输入框 */
.captcha-wrapper {
    position: relative;
}
.captcha-wrapper .input-field {
    padding-right: 110px;
}
.captcha-btn {
    position: absolute;
    right: 6px;
    top: 50%;
    transform: translateY(-50%);
    padding: 8px 14px;
    border: none;
    border-radius: 10px;
    background: var(--primary);
    color: #fff;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s ease;
    white-space: nowrap;
}
.captcha-btn:hover {
    background: var(--primary-hover);
}
.captcha-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}

.msg-box { margin-top: 24px; text-align: center; font-size: 14px; font-weight: 600; height: 20px; opacity: 0; transition: opacity 0.3s; }
.msg-box.show { opacity: 1; }
.msg-success { color: var(--primary); }
.msg-error { color: #ff3b30; }

/* 地平线5冲击波本体 (动态生成) */
.fh5-shockwave {
    position: fixed;
    border-radius: 50%;
    transform: translate(-50%, -50%) scale(0);
    pointer-events: none;
    z-index: 9999;
    opacity: 0.9;
    /* 强烈的玻璃扭曲感 */
    backdrop-filter: blur(40px);
    -webkit-backdrop-filter: blur(40px);
    transition: transform 0.8s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.8s ease-out;
}

@media (max-width: 768px) {
    .app-wrapper.nav-top .navbar { height: 68px; border-radius: 24px; padding: 0 20px; }
    .app-wrapper.nav-top .nav-links { display: none; }
    .app-wrapper.nav-side .navbar { top: auto; bottom: 20px; left: 20px; right: 20px; width: calc(100vw - 40px); height: 76px; flex-direction: row; padding: 0 24px; border-radius: 32px; justify-content: space-around; }
    .app-wrapper.nav-side .nav-header, .app-wrapper.nav-side .info-group { display: none; }
    .app-wrapper.nav-side .nav-links { flex-direction: row; margin: 0; width: auto; gap: 8px; }
    .app-wrapper.nav-side .nav-actions { flex-direction: row; width: auto; margin: 0; gap: 8px; position: static; }
    .app-wrapper.nav-side .nav-text, .app-wrapper.nav-side .action-text { display: none; }
    .app-wrapper.nav-side .nav-item, .app-wrapper.nav-side .action-btn { padding: 12px; justify-content: center; }
    .app-wrapper.nav-top .content { padding: 112px 24px 24px; }
    .app-wrapper.nav-side .content { padding: 24px 24px 116px; }
    .app-wrapper.nav-side.collapsed .content { padding-left: 24px; }
    .card { padding: 40px 24px; border-radius: 28px; }
}
</style>
</head>
<body>

<div class="bg-container">
    <div class="blob"></div><div class="blob"></div><div class="blob"></div><div class="blob"></div>
</div>

<div class="app-wrapper nav-side" id="app">
    <nav class="navbar">
        <div class="nav-header">
            <div class="logo-container">
                <div class="logo-icon">F</div>
                <div class="logo-text">ME-FRPC</div>
            </div>
            <button class="toggle-btn" id="toggleBtn">
                <svg viewBox="0 0 24 24"><path d="M15.41 16.59L10.83 12l4.58-4.59L14 6l-6 6 6 6 1.41-1.41z"/></svg>
            </button>
        </div>

        <div class="nav-links">
            <a href="#" class="nav-item active">
                <div class="icon-wrap"><svg viewBox="0 0 24 24"><path d="M12 3L4 9v12h16V9l-8-6zm6 16h-3v-6H9v6H6v-9l6-4.5 6 4.5v9z"/></svg></div>
                <span class="nav-text">登录</span>
            </a>
        </div>


        <div class="info-group">
            <div class="info-box" id="hitokotoBox">
                <div class="hitokoto-text" id="hitoText">加载中...</div>
                <div class="hitokoto-author" id="hitoAuthor"></div>
            </div>
        </div>


        <div class="nav-actions">
            <button class="action-btn" id="themeBtn" title="左键切换，右键预览">
                <div class="icon-wrap"><svg viewBox="0 0 24 24"><path d="M12 22C17.5228 22 22 17.5228 22 12C22 6.47715 17.5228 2 12 2C6.47715 2 2 6.47715 2 12C2 17.5228 6.47715 22 12 22ZM12 20.5V3.5C16.6944 3.5 20.5 7.30558 20.5 12C20.5 16.6944 16.6944 20.5 12 20.5Z"/></svg></div>
                <span class="action-text">外观切换</span>
            </button>
            <div class="theme-popover" id="themePopover"></div>
            
            <button class="action-btn" id="layoutBtn">
                <div class="icon-wrap"><svg viewBox="0 0 24 24"><path d="M4 6c0-1.1.9-2 2-2h12c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H6c-1.1 0-2-.9-2-2V6zm2 0v12h12V6H6zm2 2h8v2H8V8zm0 4h8v2H8v-2zm0 4h5v2H8v-2z"/></svg></div>
                <span class="action-text">布局视图</span>
            </button>
        </div>
    </nav>

    <main class="content">
        <div class="card" id="mainCard">
            <div class="card-header">
                <div class="card-title">连接网络</div>
                <div class="card-subtitle">选择登录方式</div>
            </div>

            <!-- 登录方式切换标签 -->
            <div class="tab-bar">
                <button class="tab-btn active" data-tab="token">密钥登录</button>
                <button class="tab-btn" data-tab="password">密码登录</button>
            </div>

            <!-- 密钥登录表单 -->
            <form id="form" class="login-form active" data-form="token">
                <div class="input-wrapper">
                    <input type="text" class="input-field" id="token" required autocomplete="off" placeholder="Accesstoken (runId_proxyId)">
                </div>
                <button type="submit" class="submit-btn" id="submitBtn">
                    <span class="btn-text">立即启动</span>
                </button>
            </form>

            <!-- 密码登录表单 -->
            <form id="passForm" class="login-form" data-form="password">
                <div class="input-wrapper">
                    <input type="text" class="input-field" id="passUsername" required autocomplete="username" placeholder="用户名">
                </div>
                <div class="input-wrapper">
                    <input type="password" class="input-field" id="passPassword" required autocomplete="current-password" placeholder="密码">
                </div>
                <div class="input-wrapper captcha-wrapper">
                    <input type="text" class="input-field" id="passCaptcha" required autocomplete="off" placeholder="人机验证码">
                    <button type="button" class="captcha-btn" id="captchaBtn">获取验证码</button>
                </div>
                <button type="submit" class="submit-btn" id="passSubmitBtn">
                    <span class="btn-text">密码登录</span>
                </button>
            </form>

            <div class="msg-box" id="msgBox"></div>
        </div>
    </main>
</div>

<script>
    // 禁用右键
    document.addEventListener('contextmenu', e => {
        if (e.target.tagName.toLowerCase() !== 'input') e.preventDefault();
    });

    let currentX = 0, currentY = 0, targetX = 0, targetY = 0;
    document.addEventListener('mousemove', e => {
        targetX = (e.clientX - window.innerWidth / 2) * 0.015;
        targetY = (e.clientY - window.innerHeight / 2) * 0.015;
    });

    const animateMouse = () => {
        currentX += (targetX - currentX) * 0.1;
        currentY += (targetY - currentY) * 0.1;
        document.documentElement.style.setProperty('--mx', `${currentX.toFixed(1)}px`);
        document.documentElement.style.setProperty('--my', `${currentY.toFixed(1)}px`);
        requestAnimationFrame(animateMouse);
    };
    animateMouse();

    const app = document.getElementById('app');
    const themeBtn = document.getElementById('themeBtn');
    const layoutBtn = document.getElementById('layoutBtn');
    const themePopover = document.getElementById('themePopover');

    // 主题数据配置（包含提取给冲击波用的核心颜色 waveColor）
    const themes = [
        { id: 'colorful-black', gradient: 'linear-gradient(135deg, #1a1a24, #4a6fff)', waveColor: 'rgba(74, 111, 255, 0.4)', name: '斑斓黑' },
        { id: 'light', gradient: 'linear-gradient(135deg, #ffffff, #d1d1d6)', waveColor: 'rgba(255, 255, 255, 0.7)', name: '明亮白' },
        { id: 'dark', gradient: 'linear-gradient(135deg, #2c2c2e, #32d74b)', waveColor: 'rgba(50, 215, 75, 0.3)', name: '深邃暗' },
        { id: 'warm', gradient: 'linear-gradient(135deg, #fff3e0, #f59e0b)', waveColor: 'rgba(245, 158, 11, 0.4)', name: '暖阳橘' },
        { id: 'cool', gradient: 'linear-gradient(135deg, #0f172a, #06b6d4)', waveColor: 'rgba(6, 182, 212, 0.4)', name: '冷酷蓝' },
        { id: 'midnight', gradient: 'linear-gradient(135deg, #1e1e2c, #5e5ce6)', waveColor: 'rgba(94, 92, 230, 0.4)', name: '午夜紫' },
        { id: 'forest', gradient: 'linear-gradient(135deg, #142314, #00c7be)', waveColor: 'rgba(0, 199, 190, 0.4)', name: '翡翠林' },
        { id: 'sunset', gradient: 'linear-gradient(135deg, #381422, #ff2d55)', waveColor: 'rgba(255, 45, 85, 0.4)', name: '绯红霞' },
        { id: 'ocean', gradient: 'linear-gradient(135deg, #08202a, #32ade6)', waveColor: 'rgba(50, 173, 230, 0.4)', name: '深海蓝' }
    ];
    
    let currentThemeIndex = 0;
    let isTransitioning = false; // 防止狂点导致动画重叠崩溃

    // ==== 核心：地平线5 (FH5) 时空扭曲冲击波引擎 ====
    const triggerFH5Shockwave = (x, y, targetIndex) => {
        if (isTransitioning) return;
        isTransitioning = true;
        
        const nextTheme = themes[targetIndex];
        
        // 1. 生成并引爆冲击波
        const wave = document.createElement('div');
        wave.className = 'fh5-shockwave';
        wave.style.left = `${x}px`;
        wave.style.top = `${y}px`;
        // 让冲击波的尺寸足以覆盖最极端的屏幕对角线
        const maxDim = Math.max(window.innerWidth, window.innerHeight) * 2.5;
        wave.style.width = `${maxDim}px`;
        wave.style.height = `${maxDim}px`;
        // 冲击波本体颜色（带有极强的弥散光晕）
        wave.style.background = `radial-gradient(circle, ${nextTheme.waveColor} 0%, transparent 60%)`;
        document.body.appendChild(wave);

        // 2. 触发 UI 层的物理扭曲（轻微缩小+动态模糊）
        app.classList.add('fh5-warping');

        // 3. 释放动画
        requestAnimationFrame(() => {
            wave.style.transform = 'translate(-50%, -50%) scale(1)';
        });

        // 4. 当冲击波和模糊达到巅峰时 (约 250ms 后)，瞬间重构底层天气/主题变量
        setTimeout(() => {
            currentThemeIndex = targetIndex;
            document.documentElement.setAttribute('data-theme', nextTheme.id);
            document.querySelectorAll('.theme-dot').forEach((d, i) => d.className = 'theme-dot' + (i === targetIndex ? ' active' : ''));
            
            // UI 层从扭曲中恢复
            app.classList.remove('fh5-warping');
            // 冲击波开始消散
            wave.style.opacity = '0';
        }, 300);

        // 5. 垃圾回收，打扫战场
        setTimeout(() => {
            wave.remove();
            isTransitioning = false;
        }, 1100);
    };

    // 渲染右键预览圆点
    themes.forEach((t, index) => {
        const dot = document.createElement('div');
        dot.className = 'theme-dot' + (index === 0 ? ' active' : '');
        dot.style.background = t.gradient;
        dot.title = t.name;
        dot.addEventListener('click', (e) => {
            e.stopPropagation();
            if(!isTransitioning) triggerFH5Shockwave(e.clientX, e.clientY, index);
        });
        themePopover.appendChild(dot);
    });

    // 左键点击：在按钮位置爆发冲击波，切换下一个
    themeBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        themePopover.classList.remove('show');
        if(!isTransitioning) {
            let nextIndex = (currentThemeIndex + 1) % themes.length;
            // 巧妙获取按钮在屏幕上的确切中心点，作为爆发圆心
            const rect = themeBtn.getBoundingClientRect();
            const startX = rect.left + rect.width / 2;
            const startY = rect.top + rect.height / 2;
            triggerFH5Shockwave(startX, startY, nextIndex);
        }
    });

    // 右键点击：打开面板
    themeBtn.addEventListener('contextmenu', (e) => {
        e.stopPropagation();
        e.preventDefault(); 
        themePopover.classList.toggle('show');
    });

    document.addEventListener('click', (e) => {
        if (!themePopover.contains(e.target)) themePopover.classList.remove('show');
    });

    layoutBtn.addEventListener('click', () => {
        app.classList.toggle('nav-side');
        app.classList.toggle('nav-top');
    });
    document.getElementById('toggleBtn').addEventListener('click', () => {
        app.classList.toggle('collapsed');
    });

    // --- 一言模块 ---
    const fetchHitokoto = async () => {
        try {
            const res = await fetch('https://v1.hitokoto.cn/?c=i&c=d');
            const data = await res.json();
            document.getElementById('hitoText').textContent = data.hitokoto;
            document.getElementById('hitoAuthor').textContent = data.from ? `— ${data.from}` : '';
        } catch (e) {
            document.getElementById('hitoText').textContent = "保持专注，保持简单。";
        }
    };
    document.getElementById('hitokotoBox').addEventListener('click', fetchHitokoto);
    fetchHitokoto();

    // --- 登录表单 ---
    const form = document.getElementById('form');
    const tokenInput = document.getElementById('token');
    const submitBtn = document.getElementById('submitBtn');
    const msgBox = document.getElementById('msgBox');
    const btnText = submitBtn.querySelector('.btn-text');

    const showMsg = (text, isError = true) => {
        msgBox.textContent = text;
        msgBox.className = 'msg-box show ' + (isError ? 'msg-error' : 'msg-success');
    };

    const setLoading = (loading) => {
        if (loading) {
            btnText.textContent = '验证中...';
            submitBtn.disabled = true;
            submitBtn.style.opacity = '0.7';
        } else {
            btnText.textContent = '立即启动';
            submitBtn.disabled = false;
            submitBtn.style.opacity = '1';
        }
    };

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const token = tokenInput.value.trim();
        if (!token) {
            showMsg('请输入访问密钥');
            return;
        }

        setLoading(true);
        showMsg('', false);

        try {
            const res = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ accesstoken: token })
            });
            const data = await res.json();

            if (data.code === 200) {
                showMsg('登录成功！正在跳转...', false);
                setTimeout(() => { window.location.href = '/dashboard.html'; }, 500);
            } else if (data.code === 401) {

                showMsg('访问密钥错误，请检查后重试');
            } else {
                showMsg(data.message || '登录失败');
            }
        } catch (err) {
            showMsg('网络错误，请检查本地服务');
        } finally {
            setLoading(false);
        }
    });

    // --- 自动登录检测 ---
    const tryAutoLogin = async () => {
        try {
            const res = await fetch('/api/status');
            const data = await res.json();
            if (data.code === 200 && data.accesstoken) {
                showMsg('检测到已保存的密钥，正在自动登录...', false);
                setLoading(true);

                const loginRes = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ accesstoken: data.accesstoken })
                });
                const loginData = await loginRes.json();

                if (loginData.code === 200) {
                    showMsg('自动登录成功！正在跳转...', false);
                    setTimeout(() => { window.location.href = '/dashboard.html'; }, 500);
                } else {
                    showMsg('自动登录失败: ' + (loginData.message || '密钥已失效'));
                    setLoading(false);
                }

            }
        } catch (err) {
            // 忽略自动登录失败
        }
    };
    tryAutoLogin();

    // ====== EULA 协议检查 ======
    const checkEula = async () => {
        try {
            const res = await fetch('/api/eula');
            const data = await res.json();
            if (data.code === 200 && data.eula === "null") {
                showEulaModal();
            }
        } catch (e) {}
    };

    const showEulaModal = () => {
        const overlay = document.createElement('div');
        overlay.style.cssText = 'position:fixed;top:0;left:0;width:100vw;height:100vh;z-index:100000;background:rgba(0,0,0,0.6);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);display:flex;align-items:center;justify-content:center;';
        const modal = document.createElement('div');
        modal.style.cssText = 'background:var(--bg-base);border:1px solid var(--glass-border);border-radius:28px;width:90%;max-width:640px;max-height:85vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,0.5);transform:scale(0.9);opacity:0;transition:all 0.4s cubic-bezier(0.34,1.56,0.64,1);overflow:hidden;';
        modal.innerHTML =
            '<div style="padding:28px 32px 0;flex-shrink:0;">' +
                '<div style="font-size:22px;font-weight:700;margin-bottom:4px;">📋 用户协议</div>' +
                '<div style="font-size:13px;color:var(--text-sec);">Fan-ME-FRP-Launcher 崩溃报告与错误日志收集协议</div>' +
            '</div>' +
            '<div style="padding:20px 32px;overflow-y:auto;flex:1;font-size:14px;line-height:1.8;color:var(--text-main);">' +
                '<h3 style="font-size:16px;margin-bottom:12px;">崩溃报告与错误日志收集协议</h3>' +
                '<p style="font-size:13px;color:var(--text-sec);margin-bottom:16px;">（最后修订：2026-05-27）</p>' +
                '<h4 style="font-size:14px;margin:16px 0 8px;">1. 收集范围</h4>' +
                '<p>本软件在运行过程中可能生成以下类型的数据，并仅用于第 2 条所述之目的：</p>' +
                '<ul style="padding-left:20px;margin:8px 0;">' +
                    '<li><strong>崩溃报告</strong> — 包含异常堆栈、线程转储、内存使用情况、系统信息等。</li>' +
                    '<li><strong>错误日志</strong> — 软件运行期间记录的警告、异常、调试信息（不包含 Token 等敏感内容）。</li>' +
                    '<li><strong>运行环境信息</strong> — 操作系统版本、Java 版本、CPU 核心数等非个人标识信息。</li>' +
                '</ul>' +
                '<h4 style="font-size:14px;margin:16px 0 8px;">2. 用途</h4>' +
                '<p>上述数据<strong>仅用于</strong>：诊断软件缺陷、修复错误、提升稳定性、优化兼容性。严禁用于广告投放、用户画像、转售等。</p>' +
                '<h4 style="font-size:14px;margin:16px 0 8px;">3. 上传前提</h4>' +
                '<p><strong>本软件默认不会上传任何数据。</strong>未经用户主动同意，绝不私自上传任何报告或日志。同意状态保存在本地，默认值为"不同意"。</p>' +
                '<h4 style="font-size:14px;margin:16px 0 8px;">4. 数据处理与匿名化</h4>' +
                '<p>上传前会进行匿名化处理：移除本地用户名、文件路径中的个人标识，不传输密码、Token、隧道配置内容。</p>' +
                '<h4 style="font-size:14px;margin:16px 0 8px;">5. 第三方共享限制</h4>' +
                '<p>开发者不会将原始崩溃报告出售或分享给任何无关第三方。</p>' +
                '<h4 style="font-size:14px;margin:16px 0 8px;">6. 儿童隐私</h4>' +
                '<p>若您所在司法管辖区要求未成年人须取得监护人同意，您须确保监护人已阅读并同意本条款。</p>' +
                '<h4 style="font-size:14px;margin:16px 0 8px;">7. 协议接受</h4>' +
                '<p><strong>当您点击「我同意」按钮时，即表示您已阅读、理解并接受本协议的全部条款。</strong></p>' +
            '</div>' +
            '<div style="padding:20px 32px 28px;display:flex;gap:12px;justify-content:flex-end;flex-shrink:0;border-top:1px solid var(--glass-border);">' +
                '<button class="eula-reject" style="padding:12px 28px;border-radius:14px;border:1px solid var(--glass-border);background:transparent;color:var(--text-sec);font-size:15px;font-weight:600;cursor:pointer;transition:all 0.2s;">拒绝</button>' +
                '<button class="eula-accept" style="padding:12px 28px;border-radius:14px;border:none;background:var(--primary);color:#fff;font-size:15px;font-weight:600;cursor:pointer;transition:all 0.2s;">我同意</button>' +
            '</div>';
        overlay.appendChild(modal);
        document.body.appendChild(overlay);
        requestAnimationFrame(() => {
            modal.style.transform = 'scale(1)';
            modal.style.opacity = '1';
        });
        modal.querySelector('.eula-reject').addEventListener('click', async () => {
            try { await fetch('/api/eula', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ eula: 'false' }) }); } catch (e) {}
            overlay.remove();
        });
        modal.querySelector('.eula-accept').addEventListener('click', async () => {
            try { await fetch('/api/eula', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ eula: 'true' }) }); } catch (e) {}
            overlay.remove();
        });
    };

    setTimeout(checkEula, 1000);

    // --- Tab 切换 ---
    const tabBtns = document.querySelectorAll('.tab-btn');
    const loginForms = document.querySelectorAll('.login-form');

    tabBtns.forEach(btn => {
        btn.addEventListener('click', () => {
            // 切换 tab 按钮状态
            tabBtns.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            // 切换表单显示
            const tab = btn.dataset.tab;
            loginForms.forEach(f => f.classList.remove('active'));
            document.querySelector(`.login-form[data-form="${tab}"]`).classList.add('active');

            // 清空消息
            msgBox.className = 'msg-box';
        });
    });

    // --- 密码登录 ---
    const passForm = document.getElementById('passForm');
    const passUsername = document.getElementById('passUsername');
    const passPassword = document.getElementById('passPassword');
    const passCaptcha = document.getElementById('passCaptcha');
    const passSubmitBtn = document.getElementById('passSubmitBtn');
    const captchaBtn = document.getElementById('captchaBtn');
    const passBtnText = passSubmitBtn.querySelector('.btn-text');

    // 获取验证码按钮
    captchaBtn.addEventListener('click', () => {
        const url = 'https://www.mefrp.com/3rdparty/captcha?client=Fan-ME-FRP-Launcher';
        fetch('/api/openurl', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ url: url })
        })
        .then(res => res.json())
        .then(data => {
            if (data.code !== 200) {
                showMsg(data.message || 'OMG BRO 没浏览器我也无能为力啊');
            } else {
                showMsg('已打开浏览器，请完成人机验证后复制验证码', false);
            }
        })
        .catch(() => {
            showMsg('OMG BRO 没浏览器我也无能为力啊');
        });
    });

    const setPassLoading = (loading) => {
        if (loading) {
            passBtnText.textContent = '登录中...';
            passSubmitBtn.disabled = true;
            passSubmitBtn.style.opacity = '0.7';
        } else {
            passBtnText.textContent = '密码登录';
            passSubmitBtn.disabled = false;
            passSubmitBtn.style.opacity = '1';
        }
    };

    passForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const username = passUsername.value.trim();
        const password = passPassword.value.trim();
        const captcha = passCaptcha.value.trim();

        if (!username) {
            showMsg('请输入用户名');
            return;
        }
        if (!password) {
            showMsg('请输入密码');
            return;
        }
        if (!captcha) {
            showMsg('请获取并输入人机验证码');
            return;
        }

        setPassLoading(true);
        showMsg('', false);

        try {
            const res = await fetch('/api/passlogin', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    username: username,
                    password: password,
                    captchaToken: captcha
                })
            });
            const data = await res.json();

            if (data.code === 200) {
                showMsg('登录成功！正在跳转...', false);
                setTimeout(() => { window.location.href = '/dashboard.html'; }, 500);
            } else {
                showMsg(data.message || '登录失败');
            }
        } catch (err) {
            showMsg('网络错误，请检查本地服务');
        } finally {
            setPassLoading(false);
        }
    });

</script>

</body>
</html>
