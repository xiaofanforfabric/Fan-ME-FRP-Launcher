<!DOCTYPE html>
<html lang="zh-CN" data-theme="colorful-black">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Fan-ME-FRP - 控制台</title>
<style>
:root {
    --bg-base: #f4f5f7; --glass-bg: rgba(255, 255, 255, 0.45); --glass-border: rgba(255, 255, 255, 0.5); --glass-highlight: rgba(255, 255, 255, 0.8); --glass-shadow: rgba(0, 0, 0, 0.08);
    --text-main: #1d1d1f; --text-sec: #86868b; --primary: #0071e3; --primary-hover: #0077ed; --primary-light: rgba(0, 113, 227, 0.12);
    --blob-1: rgba(0, 113, 227, 0.15); --blob-2: rgba(0, 200, 255, 0.15); --blob-3: rgba(120, 0, 255, 0.1); --blob-4: rgba(255, 45, 85, 0.1);
    --spring: cubic-bezier(0.34, 1.56, 0.64, 1); --spring-smooth: cubic-bezier(0.25, 1, 0.3, 1); --duration: 0.6s;
    --nav-width: 280px; --nav-collapsed-width: 84px; --mx: 0px; --my: 0px;
}
[data-theme="colorful-black"] {
    --bg-base: #050508; --glass-bg: rgba(20, 20, 25, 0.35); --glass-border: rgba(255, 255, 255, 0.06); --glass-highlight: rgba(255, 255, 255, 0.02); --glass-shadow: rgba(0, 0, 0, 0.8);
    --text-main: #e8e8ed; --text-sec: #8a8a93; --primary: #4a6fff; --primary-hover: #6b8aff; --primary-light: rgba(74, 111, 255, 0.15);
    --blob-1: rgba(74, 111, 255, 0.25); --blob-2: rgba(138, 43, 226, 0.2); --blob-3: rgba(0, 210, 255, 0.15); --blob-4: rgba(255, 45, 85, 0.15);
}
[data-theme="dark"] { --bg-base: #000000; --glass-bg: rgba(30, 30, 35, 0.35); --glass-border: rgba(255, 255, 255, 0.15); --glass-highlight: rgba(255, 255, 255, 0.05); --glass-shadow: rgba(0, 0, 0, 0.6); --text-main: #f5f5f7; --text-sec: #a1a1a6; --primary: #32d74b; --primary-hover: #2fd146; --primary-light: rgba(50, 215, 75, 0.15); --blob-1: rgba(50, 215, 75, 0.2); --blob-2: rgba(10, 132, 255, 0.2); --blob-3: rgba(94, 92, 230, 0.15); --blob-4: rgba(255, 159, 10, 0.1); }
[data-theme="warm"] { --bg-base: #fdf6f0; --glass-bg: rgba(255, 248, 240, 0.45); --glass-border: rgba(255, 255, 255, 0.6); --glass-highlight: rgba(255, 255, 255, 0.9); --glass-shadow: rgba(139, 94, 52, 0.08); --text-main: #4a3b32; --text-sec: #9e8e82; --primary: #d97706; --primary-hover: #f59e0b; --primary-light: rgba(217, 119, 6, 0.12); --blob-1: rgba(255, 149, 0, 0.15); --blob-2: rgba(255, 204, 0, 0.15); --blob-3: rgba(255, 59, 48, 0.1); --blob-4: rgba(175, 82, 222, 0.1); }
[data-theme="cool"] { --bg-base: #080b12; --glass-bg: rgba(20, 30, 45, 0.35); --glass-border: rgba(255, 255, 255, 0.1); --glass-highlight: rgba(255, 255, 255, 0.05); --glass-shadow: rgba(0, 0, 0, 0.6); --text-main: #f8fafc; --text-sec: #94a3b8; --primary: #06b6d4; --primary-hover: #22d3ee; --primary-light: rgba(6, 182, 212, 0.15); --blob-1: rgba(100, 210, 255, 0.2); --blob-2: rgba(10, 132, 255, 0.2); --blob-3: rgba(191, 90, 242, 0.15); --blob-4: rgba(94, 92, 230, 0.15); }
[data-theme="midnight"] { --bg-base: #050510; --glass-bg: rgba(15, 15, 30, 0.4); --glass-border: rgba(255, 255, 255, 0.08); --glass-highlight: rgba(255, 255, 255, 0.03); --glass-shadow: rgba(0, 0, 0, 0.7); --text-main: #e2e2ea; --text-sec: #7e7e8f; --primary: #5e5ce6; --primary-hover: #7d7aff; --primary-light: rgba(94, 92, 230, 0.15); --blob-1: rgba(94, 92, 230, 0.25); --blob-2: rgba(191, 90, 242, 0.2); --blob-3: rgba(10, 132, 255, 0.15); --blob-4: rgba(255, 55, 95, 0.1); }
[data-theme="forest"] { --bg-base: #0a110a; --glass-bg: rgba(20, 35, 20, 0.35); --glass-border: rgba(255, 255, 255, 0.1); --glass-highlight: rgba(255, 255, 255, 0.05); --glass-shadow: rgba(0, 0, 0, 0.5); --text-main: #f0f7f0; --text-sec: #8fbc8f; --primary: #00c7be; --primary-hover: #00e0d6; --primary-light: rgba(0, 199, 190, 0.15); --blob-1: rgba(0, 199, 190, 0.2); --blob-2: rgba(50, 215, 75, 0.2); --blob-3: rgba(255, 204, 0, 0.15); --blob-4: rgba(0, 113, 227, 0.1); }
[data-theme="sunset"] { --bg-base: #1a0810; --glass-bg: rgba(40, 20, 30, 0.35); --glass-border: rgba(255, 255, 255, 0.12); --glass-highlight: rgba(255, 255, 255, 0.06); --glass-shadow: rgba(0, 0, 0, 0.6); --text-main: #ffe4eb; --text-sec: #b08a95; --primary: #ff2d55; --primary-hover: #ff4a6e; --primary-light: rgba(255, 45, 85, 0.15); --blob-1: rgba(255, 45, 85, 0.25); --blob-2: rgba(255, 149, 0, 0.2); --blob-3: rgba(175, 82, 222, 0.15); --blob-4: rgba(255, 204, 0, 0.15); }
[data-theme="ocean"] { --bg-base: #041015; --glass-bg: rgba(15, 35, 45, 0.35); --glass-border: rgba(255, 255, 255, 0.1); --glass-highlight: rgba(255, 255, 255, 0.05); --glass-shadow: rgba(0, 0, 0, 0.6); --text-main: #e0f4fc; --text-sec: #7aa5b5; --primary: #32ade6; --primary-hover: #4ec0f5; --primary-light: rgba(50, 173, 230, 0.15); --blob-1: rgba(50, 173, 230, 0.25); --blob-2: rgba(0, 199, 190, 0.2); --blob-3: rgba(10, 132, 255, 0.15); --blob-4: rgba(94, 92, 230, 0.1); }

* { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; -webkit-tap-highlight-color: transparent; }
body { background: var(--bg-base); color: var(--text-main); overflow: hidden; user-select: none; -webkit-user-select: none; }
input { user-select: auto; -webkit-user-select: auto; }

.bg-container { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1; pointer-events: none; overflow: hidden; }
.blob { position: absolute; border-radius: 50%; will-change: transform; }
.blob:nth-child(1) { width: 120vw; height: 120vw; top: -20vh; left: -10vw; background: radial-gradient(circle, var(--blob-1) 0%, transparent 60%); animation: drift1 30s infinite alternate ease-in-out; }
.blob:nth-child(2) { width: 100vw; height: 100vw; bottom: -20vh; right: -20vw; background: radial-gradient(circle, var(--blob-2) 0%, transparent 60%); animation: drift2 35s infinite alternate ease-in-out; }
.blob:nth-child(3) { width: 90vw; height: 90vw; top: 30vh; left: 40vw; background: radial-gradient(circle, var(--blob-3) 0%, transparent 60%); animation: drift3 40s infinite alternate ease-in-out; }
.blob:nth-child(4) { width: 80vw; height: 80vw; bottom: 10vh; left: -10vw; background: radial-gradient(circle, var(--blob-4) 0%, transparent 60%); animation: drift4 28s infinite alternate ease-in-out; }
@keyframes drift1 { 0% { transform: translate3d(0, 0, 0) scale(1); } 100% { transform: translate3d(15vw, 10vh, 0) scale(1.1); } }
@keyframes drift2 { 0% { transform: translate3d(0, 0, 0) scale(1); } 100% { transform: translate3d(-10vw, -15vh, 0) scale(1.2); } }
@keyframes drift3 { 0% { transform: translate3d(0, 0, 0) scale(1); } 100% { transform: translate3d(-15vw, 5vh, 0) scale(0.9); } }
@keyframes drift4 { 0% { transform: translate3d(0, 0, 0) scale(1); } 100% { transform: translate3d(10vw, -10vh, 0) scale(1.15); } }

.app-wrapper { width: 100vw; height: 100vh; display: flex; position: relative; perspective: 1000px; transition: transform 0.5s cubic-bezier(0.19, 1, 0.22, 1), filter 0.5s cubic-bezier(0.19, 1, 0.22, 1); }
.app-wrapper.fh5-warping { transform: scale(0.95); filter: blur(10px) brightness(1.2); }

.navbar, .card { background: var(--glass-bg); backdrop-filter: blur(20px) saturate(180%); -webkit-backdrop-filter: blur(20px) saturate(180%); border: 1px solid var(--glass-border); box-shadow: 0 10px 40px var(--glass-shadow); will-change: transform; }

.navbar { position: absolute; z-index: 100; display: flex; border-radius: 32px; transition: width 0.4s ease, height 0.4s ease; transform: translate3d(calc(var(--mx) * -0.5), calc(var(--my) * -0.5), 0); }
.app-wrapper.nav-top .navbar { top: 24px; left: 24px; right: 24px; height: 76px; width: calc(100vw - 48px); flex-direction: row; align-items: center; justify-content: space-between; padding: 0 28px; }
.app-wrapper.nav-side .navbar { top: 24px; left: 24px; bottom: 24px; width: var(--nav-width); height: calc(100vh - 48px); flex-direction: column; padding: 36px 24px; }
.app-wrapper.nav-side.collapsed .navbar { width: var(--nav-collapsed-width); padding: 36px 14px; }

.nav-header { display: flex; align-items: center; justify-content: space-between; width: 100%; transition: all var(--duration) var(--spring-smooth); height: 44px; }
.app-wrapper.nav-top .nav-header { width: auto; }
.logo-container { display: flex; align-items: center; gap: 14px; overflow: hidden; height: 100%; }
.logo-icon { width: 40px; height: 40px; border-radius: 14px; background: var(--primary); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 20px; flex-shrink: 0; box-shadow: 0 4px 16px var(--primary-light); }
.logo-text { font-size: 22px; font-weight: 700; white-space: nowrap; transition: opacity 0.3s, width 0.3s; width: 90px; opacity: 1; letter-spacing: -0.5px; }
.app-wrapper.nav-side.collapsed .logo-text { width: 0; opacity: 0; }

.toggle-btn { background: rgba(120, 120, 128, 0.12); border: none; color: var(--text-sec); cursor: pointer; display: none; align-items: center; justify-content: center; width: 36px; height: 36px; border-radius: 12px; transition: all 0.3s ease; flex-shrink: 0; }
.app-wrapper.nav-side .toggle-btn { display: flex; }
.toggle-btn:hover { background: var(--primary-light); color: var(--primary); }
.toggle-btn svg { width: 22px; height: 22px; fill: currentColor; }
.app-wrapper.nav-side.collapsed .toggle-btn { margin: 0 auto; }
.app-wrapper.nav-side.collapsed .toggle-btn svg { transform: rotate(180deg); }

.nav-links { display: flex; gap: 8px; transition: all var(--duration) ease; }
.app-wrapper.nav-top .nav-links { flex-direction: row; position: absolute; left: 50%; transform: translateX(-50%); }
.app-wrapper.nav-side .nav-links { flex-direction: column; margin-top: 48px; width: 100%; }

.nav-item { display: flex; align-items: center; padding: 14px; border-radius: 18px; text-decoration: none; color: var(--text-sec); font-weight: 600; font-size: 16px; transition: all 0.2s ease; overflow: hidden; cursor: pointer; }
.nav-item:hover, .nav-item.active { background: var(--primary-light); color: var(--primary); }
.icon-wrap { width: 26px; height: 26px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.icon-wrap svg { width: 24px; height: 24px; fill: currentColor; }
.nav-text { margin-left: 16px; white-space: nowrap; opacity: 1; width: 100%; transition: opacity 0.2s; }
.app-wrapper.nav-side.collapsed .nav-item { justify-content: center; padding: 14px 0; }
.app-wrapper.nav-side.collapsed .nav-text { width: 0; opacity: 0; margin-left: 0; }

.info-group { margin-top: auto; margin-bottom: 28px; display: flex; flex-direction: column; gap: 12px; transition: opacity 0.3s; }
.app-wrapper.nav-top .info-group { display: none; }
.app-wrapper.nav-side.collapsed .info-group { opacity: 0; pointer-events: none; height: 0; margin: 0; overflow: hidden; }

.info-box { background: rgba(120, 120, 128, 0.08); border-radius: 20px; cursor: pointer; transition: all 0.3s ease; padding: 16px 20px; border: 1px solid var(--glass-border); }
.info-box:hover { background: var(--primary-light); border-color: transparent; }
.hitokoto-text { font-size: 13px; line-height: 1.6; color: var(--text-main); font-weight: 500; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.hitokoto-author { font-size: 12px; color: var(--text-sec); text-align: right; margin-top: 8px; font-weight: 500; }

.nav-actions { display: flex; gap: 8px; position: relative; }
.app-wrapper.nav-top .nav-actions { flex-direction: row; }
.app-wrapper.nav-side .nav-actions { flex-direction: column; width: 100%; }

.action-btn { background: transparent; border: none; color: var(--text-sec); padding: 14px; border-radius: 18px; cursor: pointer; display: flex; align-items: center; transition: all 0.2s ease; }
.action-btn:hover { background: rgba(120, 120, 128, 0.12); color: var(--text-main); }
.app-wrapper.nav-side.collapsed .action-btn { justify-content: center; padding: 14px 0; }
.action-text { margin-left: 16px; font-size: 16px; font-weight: 600; white-space: nowrap; text-align: left; }
.app-wrapper.nav-top .action-text, .app-wrapper.nav-side.collapsed .action-text { display: none; }

.theme-popover { position: absolute; background: var(--glass-bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid var(--glass-border); box-shadow: 0 10px 40px rgba(0,0,0,0.15); border-radius: 20px; padding: 16px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; opacity: 0; pointer-events: none; transform: scale(0.9) translateY(5px); transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); z-index: 200; }
.theme-popover.show { opacity: 1; pointer-events: auto; transform: scale(1) translateY(0); }
.app-wrapper.nav-side .theme-popover { bottom: 0; left: calc(100% + 16px); }
.app-wrapper.nav-top .theme-popover { top: calc(100% + 16px); right: 0; }

.theme-dot { width: 32px; height: 32px; border-radius: 50%; cursor: pointer; border: 2px solid rgba(255,255,255,0.2); box-shadow: inset 0 2px 4px rgba(255,255,255,0.3), 0 4px 8px rgba(0,0,0,0.1); transition: all 0.2s; position: relative; }
.theme-dot::after { content: ''; position: absolute; top: -4px; left: -4px; right: -4px; bottom: -4px; border-radius: 50%; border: 2px solid transparent; transition: all 0.2s; }
.theme-dot:hover { transform: scale(1.15); }
.theme-dot.active { transform: scale(1.15); }
.theme-dot.active::after { border-color: var(--primary); }

.content { flex: 1; display: flex; align-items: flex-start; justify-content: center; transition: padding 0.4s ease; padding: 32px; position: relative; z-index: 10; transform-style: preserve-3d; overflow-y: auto; height: 100vh; }
.app-wrapper.nav-top .content { padding-top: 124px; }
.app-wrapper.nav-side .content { padding-left: calc(var(--nav-width) + 48px); }
.app-wrapper.nav-side.collapsed .content { padding-left: calc(var(--nav-collapsed-width) + 48px); }

.page-container { width: 100%; max-width: 800px; padding-top: 20px; }

.profile-card { border-radius: 36px; padding: 40px; margin-bottom: 24px; background: var(--glass-bg); backdrop-filter: blur(20px) saturate(180%); -webkit-backdrop-filter: blur(20px) saturate(180%); border: 1px solid var(--glass-border); box-shadow: 0 10px 40px var(--glass-shadow); transform: translate3d(calc(var(--mx) * 1.5), calc(var(--my) * 1.5), 0) rotateX(calc(var(--my) * -0.1deg)) rotateY(calc(var(--mx) * 0.1deg)); }
.profile-header { display: flex; align-items: center; gap: 24px; margin-bottom: 32px; }
.avatar { width: 72px; height: 72px; border-radius: 24px; background: var(--primary); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 32px; font-weight: 700; flex-shrink: 0; box-shadow: 0 8px 24px var(--primary-light); }
.profile-info { flex: 1; }
.profile-name { font-size: 28px; font-weight: 700; margin-bottom: 4px; }
.profile-badge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 14px; border-radius: 20px; font-size: 13px; font-weight: 600; background: var(--primary-light); color: var(--primary); }
.profile-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 24px; }
.stat-box { background: rgba(120, 120, 128, 0.08); border-radius: 20px; padding: 20px; text-align: center; border: 1px solid var(--glass-border); }
.stat-value { font-size: 24px; font-weight: 700; color: var(--primary); margin-bottom: 4px; }
.stat-label { font-size: 13px; color: var(--text-sec); font-weight: 500; }

.info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.info-item { background: rgba(120, 120, 128, 0.08); border-radius: 16px; padding: 16px 20px; border: 1px solid var(--glass-border); }
.info-label { font-size: 12px; color: var(--text-sec); font-weight: 500; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
.info-value { font-size: 16px; font-weight: 600; color: var(--text-main); }

.tunnel-card { border-radius: 36px; padding: 40px; background: var(--glass-bg); backdrop-filter: blur(20px) saturate(180%); -webkit-backdrop-filter: blur(20px) saturate(180%); border: 1px solid var(--glass-border); box-shadow: 0 10px 40px var(--glass-shadow); transform: translate3d(calc(var(--mx) * 1.5), calc(var(--my) * 1.5), 0) rotateX(calc(var(--my) * -0.1deg)) rotateY(calc(var(--mx) * 0.1deg)); }
.tunnel-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
.tunnel-title { font-size: 20px; font-weight: 700; }
.tunnel-count { font-size: 14px; color: var(--text-sec); font-weight: 500; }
.tunnel-bar { height: 8px; border-radius: 4px; background: rgba(120, 120, 128, 0.12); overflow: hidden; margin-bottom: 8px; }
.tunnel-bar-fill { height: 100%; border-radius: 4px; background: var(--primary); transition: width 0.6s ease; }
.tunnel-bar-text { font-size: 13px; color: var(--text-sec); font-weight: 500; text-align: right; }

.page-section { display: none; }
.page-section.active { display: block; }

.settings-card { border-radius: 36px; padding: 40px; background: var(--glass-bg); backdrop-filter: blur(20px) saturate(180%); -webkit-backdrop-filter: blur(20px) saturate(180%); border: 1px solid var(--glass-border); box-shadow: 0 10px 40px var(--glass-shadow); transform: translate3d(calc(var(--mx) * 1.5), calc(var(--my) * 1.5), 0) rotateX(calc(var(--my) * -0.1deg)) rotateY(calc(var(--mx) * 0.1deg)); }
.settings-title { font-size: 20px; font-weight: 700; margin-bottom: 24px; }
.settings-item { display: flex; align-items: center; justify-content: space-between; padding: 16px 0; border-bottom: 1px solid var(--glass-border); }
.settings-item:last-child { border-bottom: none; }
.settings-label { font-size: 16px; font-weight: 500; }
.settings-desc { font-size: 13px; color: var(--text-sec); margin-top: 2px; }
.logout-btn { width: 100%; padding: 16px; border-radius: 16px; border: none; background: rgba(255, 59, 48, 0.12); color: #ff3b30; font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.3s ease; margin-top: 24px; }
.logout-btn:hover { background: rgba(255, 59, 48, 0.2); }

.fh5-shockwave { position: fixed; border-radius: 50%; transform: translate(-50%, -50%) scale(0); pointer-events: none; z-index: 9999; opacity: 0.9; backdrop-filter: blur(40px); -webkit-backdrop-filter: blur(40px); transition: transform 0.8s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.8s ease-out; }

/* 隧道列表表格 */
.proxy-table-wrap { overflow-x: auto; }
.proxy-table { width: 100%; border-collapse: collapse; font-size: 14px; }
.proxy-table thead th { text-align: left; padding: 12px 16px; font-weight: 600; color: var(--text-sec); font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 1px solid var(--glass-border); }
.proxy-table tbody td { padding: 14px 16px; border-bottom: 1px solid var(--glass-border); color: var(--text-main); }
.proxy-table tbody tr:hover { background: var(--primary-light); }
.proxy-table tbody tr:last-child td { border-bottom: none; }
.proxy-table .loading-row { text-align: center; color: var(--text-sec); padding: 40px 16px; }
.proxy-table .status-online { display: inline-flex; align-items: center; gap: 6px; color: #34c759; font-weight: 600; }
.proxy-table .status-online::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: #34c759; }
.proxy-table .status-online.remote { color: #5ac8fa; }
.proxy-table .status-online.remote::before { background: #5ac8fa; }
.proxy-table .status-online.remote[title] { cursor: help; }
.proxy-table .status-offline { display: inline-flex; align-items: center; gap: 6px; color: var(--text-sec); }
.proxy-table .status-offline::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--text-sec); }
.proxy-table .status-disabled { display: inline-flex; align-items: center; gap: 6px; color: #ff3b30; font-weight: 600; }
.proxy-table .status-disabled::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: #ff3b30; }
.proxy-table .proxy-type { display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: 12px; font-weight: 600; background: var(--primary-light); color: var(--primary); }
.proxy-table .proxy-name { font-weight: 600; }

/* 节点网格 */
.node-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
.node-card { background: rgba(120, 120, 128, 0.08); border-radius: 20px; padding: 20px; border: 1px solid var(--glass-border); cursor: pointer; transition: all 0.3s ease; }
.node-card:hover { background: var(--primary-light); border-color: var(--primary); transform: translateY(-2px); }
.node-card .node-name { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
.node-card .node-region { display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: 11px; font-weight: 600; margin-bottom: 8px; }
.node-card .node-region.cn { background: rgba(52, 199, 89, 0.15); color: #34c759; }
.node-card .node-region.cnos { background: rgba(255, 149, 0, 0.15); color: #ff9500; }
.node-card .node-region.oversea { background: rgba(90, 200, 250, 0.15); color: #5ac8fa; }
.node-card .node-bandwidth { font-size: 13px; color: var(--text-sec); font-weight: 500; }
.node-card .node-desc { font-size: 12px; color: var(--text-sec); margin-top: 8px; line-height: 1.5; }

.node-card.node-disabled { opacity: 0.45; cursor: not-allowed; }
.node-card.node-disabled:hover { background: rgba(120, 120, 128, 0.08); border-color: var(--glass-border); transform: none; }

                            <div class="settings-desc" id="frpcStatus">运行中</div>

<script>
    document.addEventListener('contextmenu', e => {
        if (e.target.tagName.toLowerCase() !== 'input') e.preventDefault();
    });

    let currentX = 0, currentY = 0, targetX = 0, targetY = 0;
    document.addEventListener('mousemove', e => {
        targetX = (e.clientX - window.innerWidth / 2) * 0.015;
        targetY = (e.clientY - window.innerHeight / 2) * 0.015;
    });
    const animateMouse = () => {
        currentX += (targetX - currentX) * 0.1;
        currentY += (targetY - currentY) * 0.1;
        document.documentElement.style.setProperty('--mx', `${currentX.toFixed(1)}px`);
        document.documentElement.style.setProperty('--my', `${currentY.toFixed(1)}px`);
        requestAnimationFrame(animateMouse);
    };
    animateMouse();

    const app = document.getElementById('app');
    const themeBtn = document.getElementById('themeBtn');
    const layoutBtn = document.getElementById('layoutBtn');
    const themePopover = document.getElementById('themePopover');

    const themes = [
        { id: 'colorful-black', gradient: 'linear-gradient(135deg, #1a1a24, #4a6fff)', waveColor: 'rgba(74, 111, 255, 0.4)', name: '斑斓黑' },
        { id: 'light', gradient: 'linear-gradient(135deg, #ffffff, #d1d1d6)', waveColor: 'rgba(255, 255, 255, 0.7)', name: '明亮白' },
        { id: 'dark', gradient: 'linear-gradient(135deg, #2c2c2e, #32d74b)', waveColor: 'rgba(50, 215, 75, 0.3)', name: '深邃暗' },
        { id: 'warm', gradient: 'linear-gradient(135deg, #fff3e0, #f59e0b)', waveColor: 'rgba(245, 158, 11, 0.4)', name: '暖阳橘' },
        { id: 'cool', gradient: 'linear-gradient(135deg, #0f172a, #06b6d4)', waveColor: 'rgba(6, 182, 212, 0.4)', name: '冷酷蓝' },
        { id: 'midnight', gradient: 'linear-gradient(135deg, #1e1e2c, #5e5ce6)', waveColor: 'rgba(94, 92, 230, 0.4)', name: '午夜紫' },
        { id: 'forest', gradient: 'linear-gradient(135deg, #142314, #00c7be)', waveColor: 'rgba(0, 199, 190, 0.4)', name: '翡翠林' },
        { id: 'sunset', gradient: 'linear-gradient(135deg, #381422, #ff2d55)', waveColor: 'rgba(255, 45, 85, 0.4)', name: '绯红霞' },
        { id: 'ocean', gradient: 'linear-gradient(135deg, #08202a, #32ade6)', waveColor: 'rgba(50, 173, 230, 0.4)', name: '深海蓝' }
    ];

    let currentThemeIndex = 0;
    let isTransitioning = false;

    const triggerFH5Shockwave = (x, y, targetIndex) => {
        if (isTransitioning) return;
        isTransitioning = true;
        const nextTheme = themes[targetIndex];
        const wave = document.createElement('div');
        wave.className = 'fh5-shockwave';
        wave.style.left = x + 'px';
        wave.style.top = y + 'px';
        const maxDim = Math.max(window.innerWidth, window.innerHeight) * 2.5;
        wave.style.width = maxDim + 'px';
        wave.style.height = maxDim + 'px';
        wave.style.background = 'radial-gradient(circle, ' + nextTheme.waveColor + ' 0%, transparent 60%)';
        document.body.appendChild(wave);
        app.classList.add('fh5-warping');
        requestAnimationFrame(() => { wave.style.transform = 'translate(-50%, -50%) scale(1)'; });
        setTimeout(() => {
            currentThemeIndex = targetIndex;
            document.documentElement.setAttribute('data-theme', nextTheme.id);
            document.querySelectorAll('.theme-dot').forEach((d, i) => d.className = 'theme-dot' + (i === targetIndex ? ' active' : ''));
            app.classList.remove('fh5-warping');
            wave.style.opacity = '0';
        }, 300);
        setTimeout(() => { wave.remove(); isTransitioning = false; }, 1100);
    };

    themes.forEach((t, index) => {
        const dot = document.createElement('div');
        dot.className = 'theme-dot' + (index === 0 ? ' active' : '');
        dot.style.background = t.gradient;
        dot.title = t.name;
        dot.addEventListener('click', (e) => {
            e.stopPropagation();
            if(!isTransitioning) triggerFH5Shockwave(e.clientX, e.clientY, index);
        });
        themePopover.appendChild(dot);
    });

    themeBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        themePopover.classList.remove('show');
        if(!isTransitioning) {
            let nextIndex = (currentThemeIndex + 1) % themes.length;
            const rect = themeBtn.getBoundingClientRect();
            triggerFH5Shockwave(rect.left + rect.width / 2, rect.top + rect.height / 2, nextIndex);
        }
    });
    themeBtn.addEventListener('contextmenu', (e) => {
        e.stopPropagation();
        e.preventDefault();
        themePopover.classList.toggle('show');
    });
    document.addEventListener('click', (e) => {
        if (!themePopover.contains(e.target)) themePopover.classList.remove('show');
    });
    layoutBtn.addEventListener('click', () => {
        app.classList.toggle('nav-side');
        app.classList.toggle('nav-top');
    });
    document.getElementById('toggleBtn').addEventListener('click', () => {
        app.classList.toggle('collapsed');
    });

    // 一言
    const fetchHitokoto = async () => {
        try {
            const res = await fetch('https://v1.hitokoto.cn/?c=i&c=d');
            const data = await res.json();
            document.getElementById('hitoText').textContent = data.hitokoto;
            document.getElementById('hitoAuthor').textContent = data.from ? '— ' + data.from : '';
        } catch (e) {
            document.getElementById('hitoText').textContent = '保持专注，保持简单。';
        }
    };
    document.getElementById('hitokotoBox').addEventListener('click', fetchHitokoto);
    fetchHitokoto();

    // ====== 用户数据加载 ======
    let currentUserGroup = 'default'; // 当前用户组，默认 default

    const loadUserData = async () => {
        try {
            const res = await fetch('/api/userdata');
            const data = await res.json();

            if (data.code !== 200 || !data.data) {
                window.location.href = '/login.html';
                return;
            }

            const u = data.data;

            // 保存当前用户组
            currentUserGroup = u.group || 'default';

            // 头像
            document.getElementById('avatarLetter').textContent = u.username.charAt(0).toUpperCase();
            document.getElementById('userName').textContent = u.username;
            document.getElementById('userBadge').textContent = u.friendlyGroup || u.group;

            // 统计
            document.getElementById('statInBound').textContent = formatBandwidth(u.inBound);
            document.getElementById('statOutBound').textContent = formatBandwidth(u.outBound);
            document.getElementById('statTraffic').textContent = formatBytes(u.traffic);

            // 信息
            document.getElementById('infoUserId').textContent = u.userId;
            document.getElementById('infoEmail').textContent = u.email;
            document.getElementById('infoRealname').textContent = u.isRealname ? '已认证' : '未认证';
            document.getElementById('infoRegTime').textContent = formatTimestamp(u.regTime);
            document.getElementById('infoStatus').textContent = formatStatus(u.status);
            document.getElementById('infoSigned').textContent = u.todaySigned ? '已签到' : '未签到';

            // 隧道
            document.getElementById('tunnelCount').textContent = u.usedProxies + ' / ' + u.maxProxies;
            const pct = u.maxProxies > 0 ? Math.round((u.usedProxies / u.maxProxies) * 100) : 0;
            document.getElementById('tunnelBarFill').style.width = pct + '%';
            document.getElementById('tunnelBarText').textContent = '已使用 ' + u.usedProxies + ' 条隧道';

            // 设置
            document.getElementById('currentUser').textContent = u.username;

            // 获取 ME Frp 系统运行状态
            fetchServerStatus();

        } catch (err) {
            console.error('加载用户数据失败:', err);
            window.location.href = '/login.html';
        }
    };

    // 获取 ME Frp 系统运行状态
    async function fetchServerStatus() {
        try {
            const resp = await fetch('/api/serverstatus');
            const data = await resp.json();
            const dot = document.getElementById('mefrpDot');
            const text = document.getElementById('mefrpText');
            const statusEl = document.getElementById('mefrpStatus');
            if (data.code === 200 && data.data) {
                const status = data.data.status;
                const remark = data.data.remark || '';
                if (status === 0) {
                    dot.style.background = '#34c759';
                    text.textContent = 'ME Frp ' + remark;
                    text.style.color = '#34c759';
                    statusEl.style.background = 'rgba(52,199,89,0.12)';
                } else if (status === 1) {
                    dot.style.background = '#ff9500';
                    text.textContent = 'ME Frp ' + remark;
                    text.style.color = '#ff9500';
                    statusEl.style.background = 'rgba(255,149,0,0.12)';
                } else {
                    dot.style.background = '#ff3b30';
                    text.textContent = 'ME Frp ' + remark;
                    text.style.color = '#ff3b30';
                    statusEl.style.background = 'rgba(255,59,48,0.12)';
                }
            } else {
                dot.style.background = 'var(--text-sec)';
                text.textContent = '无法获取状态';
                text.style.color = 'var(--text-sec)';
                statusEl.style.background = 'rgba(120,120,128,0.08)';
            }
        } catch (e) {
            const dot = document.getElementById('mefrpDot');
            const text = document.getElementById('mefrpText');
            const statusEl = document.getElementById('mefrpStatus');
            dot.style.background = 'var(--text-sec)';
            text.textContent = '检查失败';
            text.style.color = 'var(--text-sec)';
            statusEl.style.background = 'rgba(120,120,128,0.08)';
        }
    }

    const formatBandwidth = (kbps) => {
        const mbps = kbps / 128;
        return mbps.toFixed(0) + ' Mbps';
    };



    const formatBytes = (bytes) => {
        if (bytes >= 1073741824) return (bytes / 1073741824).toFixed(2) + ' GB';
        if (bytes >= 1048576) return (bytes / 1048576).toFixed(2) + ' MB';
        if (bytes >= 1024) return (bytes / 1024).toFixed(2) + ' KB';
        return bytes + ' B';
    };

    const formatTimestamp = (ts) => {
        const d = new Date(ts * 1000);
        return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
    };

    const formatStatus = (status) => {
        if (status === 0) return '正常';
        if (status === 1) return '封禁';
        if (status === 2) return '流量超限';
        return '未知';
    };

    // 页面切换 - 每次切换时刷新对应子页面数据
    document.querySelectorAll('.nav-item[data-page]').forEach(item => {
        item.addEventListener('click', () => {
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            item.classList.add('active');
            document.querySelectorAll('.page-section').forEach(s => s.classList.remove('active'));
            const pageId = 'page-' + item.dataset.page;
            document.getElementById(pageId).classList.add('active');

            // 根据页面类型刷新数据
            switch (item.dataset.page) {
                case 'profile':
                    loadUserData();
                    break;
                case 'tunnels':
                    loadProxyList();
                    break;
                case 'newproxy':
                    loadNodeList();
                    break;
                case 'serverstatus':
                    loadServerStatus();
                    break;
            }
        });
    });

    // 退出登录
    document.getElementById('logoutBtn').addEventListener('click', async () => {
        try {
            await fetch('/api/logout', { method: 'POST' });
        } catch (e) {}
        window.location.href = '/login.html';
    });

    // 加载隧道列表
    async function loadProxyList() {
        try {
            const [proxyResp, statusResp] = await Promise.all([
                fetch('/api/proxylist'),
                fetch('/api/getserverstatus')
            ]);
            const data = await proxyResp.json();
            const statusData = await statusResp.json();
            if (data.code !== 200 || !data.data) {
                document.getElementById('proxyTableBody').innerHTML = '<tr><td colspan="7" class="loading-row">获取隧道列表失败</td></tr>';
                return;
            }
            const proxies = data.data.proxies || [];
            const nodes = data.data.nodes || [];
            // 缓存数据供详情弹窗使用
            cachedProxies = proxies;
            cachedNodeMap = {};
            nodes.forEach(n => { cachedNodeMap[n.nodeId] = n; });
            // 构建节点名称映射
            const nodeMap = {};
            nodes.forEach(n => { nodeMap[n.nodeId] = n.name; });

            // 获取本地运行状态映射
            const localRunningMap = {};
            if (statusData.code === 200 && statusData.data) {
                Object.assign(localRunningMap, statusData.data);
            }

            document.getElementById('proxyCount').textContent = proxies.length + ' 条';

            const tbody = document.getElementById('proxyTableBody');
            if (proxies.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" class="loading-row">暂无隧道</td></tr>';
                return;
            }

            let html = '';
            proxies.forEach(p => {
                let statusClass, statusText, statusTitle;
                if (p.isDisabled) {
                    statusClass = 'status-disabled';
                    statusText = '禁用';
                    statusTitle = '';
                } else if (p.isOnline) {
                    // 检查是否在本机运行
                    const isLocalRunning = localRunningMap[String(p.proxyId)] === true;
                    if (isLocalRunning) {
                        statusClass = 'status-online';
                        statusText = '在线';
                        statusTitle = '';
                    } else {
                        statusClass = 'status-online remote';
                        statusText = '在线';
                        statusTitle = '隧道在线，但是未在本机运行，可能是其他机器或官网状态未更新。';
                    }
                } else {
                    statusClass = 'status-offline';
                    statusText = '离线';
                    statusTitle = '';
                }
                const nodeName = nodeMap[p.nodeId] || '节点#' + p.nodeId;
                const localAddr = p.localIp + ':' + p.localPort;
                const remotePort = p.proxyType === 'http' ? (p.domain || '-') : (p.remotePort || '-');
                html += '<tr>' +
                    '<td><span class="proxy-name">' + escapeHtml(p.proxyName) + '</span></td>' +
                    '<td><span class="proxy-type">' + escapeHtml(p.proxyType) + '</span></td>' +
                    '<td>' + escapeHtml(nodeName) + '</td>' +
                    '<td>' + escapeHtml(localAddr) + '</td>' +
                    '<td>' + escapeHtml(String(remotePort)) + '</td>' +
                    '<td><span class="proxy-id">' + p.proxyId + '</span></td>' +
                    '<td><span class="' + statusClass + '"' + (statusTitle ? ' title="' + statusTitle + '"' : '') + '>' + statusText + '</span></td>' +
                    '<td><div class="proxy-action-wrap">' +
                        '<button class="proxy-action-btn" data-proxyid="' + p.proxyId + '" data-proxyname="' + escapeHtml(p.proxyName) + '" onclick="toggleActionMenu(event, ' + p.proxyId + ', \'' + escapeHtml(p.proxyName) + '\')">' +
                            '<svg viewBox="0 0 24 24"><path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg>' +
                        '</button>' +
                    '</div></td>' +
                    '</tr>';
            });
            tbody.innerHTML = html;
        } catch (e) {
            document.getElementById('proxyTableBody').innerHTML = '<tr><td colspan="7" class="loading-row">加载失败: ' + e.message + '</td></tr>';
        }
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/&/g,'&').replace(/</g,'<').replace(/>/g,'>').replace(/"/g,'"');
    }

    // 加载节点列表
    async function loadNodeList() {
        try {
            const resp = await fetch('/api/nodelist');
            const data = await resp.json();
            if (data.code !== 200 || !data.data) {
                document.getElementById('nodeGrid').innerHTML = '<div class="loading-row">获取节点列表失败</div>';
                return;
            }
            const nodes = data.data || [];
            document.getElementById('nodeCount').textContent = nodes.length + ' 个节点';

            const grid = document.getElementById('nodeGrid');
            if (nodes.length === 0) {
                grid.innerHTML = '<div class="loading-row">暂无可用节点</div>';
                return;
            }

            // 按区域分组排序
            const regionOrder = { 'cn': 0, 'cnos': 1, 'oversea': 2 };
            const regionLabel = { 'cn': '国内', 'cnos': '港澳台', 'oversea': '海外' };
            nodes.sort((a, b) => (regionOrder[a.region] || 9) - (regionOrder[b.region] || 9) || a.nodeId - b.nodeId);

            // 判断用户组是否在节点的 allowGroup 中
            function canAccessNode(node) {
                if (!node.allowGroup) return true;
                const groups = node.allowGroup.split(';').map(g => g.trim());
                return groups.includes(currentUserGroup);
            }

            // 判断节点是否为 VIP 节点（allowGroup 不含 default/noRealname）
            function isVipNode(node) {
                if (!node.allowGroup) return false;
                const groups = node.allowGroup.split(';').map(g => g.trim());
                return !groups.includes('default') && !groups.includes('noRealname');
            }

            let html = '';
            nodes.forEach(n => {
                const regionCls = n.region || 'oversea';
                const regionText = regionLabel[regionCls] || n.region;
                const onlineCls = n.isOnline ? 'yes' : 'no';

    function renderServerStatus(filter) {
        const tbody = document.getElementById('serverStatusBody');
        const lowerFilter = filter.toLowerCase().trim();

        let filtered = serverStatusData;
        if (lowerFilter) {
            filtered = serverStatusData.filter(n =>
                String(n.nodeId).includes(lowerFilter) ||
                (n.name && n.name.toLowerCase().includes(lowerFilter))
            );
        }

        if (filtered.length === 0) {
            tbody.innerHTML = '<tr><td colspan="11" class="loading-row">无匹配节点</td></tr>';
            return;
        }

        let html = '';
        filtered.forEach(n => {
            const statusClass = n.isOnline ? 'status-online' : 'status-offline';
            const statusText = n.isOnline ? '在线' : '离线';
            const loadPct = n.loadPercent !== undefined ? n.loadPercent : 0;
            const loadColor = loadPct >= 90 ? '#ff3b30' : loadPct >= 70 ? '#ff9500' : '#34c759';
            const uptimeStr = formatUptime(n.uptime);
            html += '<tr>' +
                '<td>' + n.nodeId + '</td>' +
                '<td><span class="proxy-name">' + escapeHtml(n.name || '') + '</span></td>' +
                '<td><span class="' + statusClass + '">' + statusText + '</span></td>' +
                '<td style="font-size:12px;color:var(--text-sec);">' + escapeHtml(n.version || '-') + '</td>' +
                '<td>' + (n.onlineClient || 0) + '</td>' +
                '<td>' + (n.onlineProxy || 0) + '</td>' +
                '<td>' + (n.curConns || 0) + '</td>' +
                '<td><span style="color:' + loadColor + ';font-weight:700;">' + loadPct + '%</span></td>' +
                '<td style="font-size:12px;">' + formatBytes(n.totalTrafficIn || 0) + '</td>' +
                '<td style="font-size:12px;">' + formatBytes(n.totalTrafficOut || 0) + '</td>' +
                '<td style="font-size:12px;color:var(--text-sec);">' + uptimeStr + '</td>' +
                '</tr>';
        });
        tbody.innerHTML = html;
    }

    function formatUptime(seconds) {
        if (!seconds || seconds <= 0) return '-';
        const days = Math.floor(seconds / 86400);
        const hours = Math.floor((seconds % 86400) / 3600);
        const mins = Math.floor((seconds % 3600) / 60);
        let parts = [];
        if (days > 0) parts.push(days + '天');
        if (hours > 0) parts.push(hours + '时');
        parts.push(mins + '分');
        return parts.join('');
    }

    function formatTimestampFull(ts) {

        return d.getFullYear() + '-' +
            String(d.getMonth()+1).padStart(2,'0') + '-' +
            String(d.getDate()).padStart(2,'0') + ' ' +
            String(d.getHours()).padStart(2,'0') + ':' +
            String(d.getMinutes()).padStart(2,'0') + ':' +
            String(d.getSeconds()).padStart(2,'0');

    // ====== Toast 提示 ======
    function showToast(message, type) {
        type = type || 'info';
        const container = document.querySelector('.toast-container') || (function() {
            const c = document.createElement('div');
            c.className = 'toast-container';
            document.body.appendChild(c);
            return c;
        })();
        const toast = document.createElement('div');
        toast.className = 'toast ' + type;
        const icons = { success: '✅', error: '❌', info: 'ℹ️' };
        toast.innerHTML = (icons[type] || 'ℹ️') + ' ' + message;
        container.appendChild(toast);
        setTimeout(() => {
            toast.style.animation = 'toastOut 0.3s ease forwards';
            setTimeout(() => toast.remove(), 300);
        }, 2500);
    }

    // ====== 确认弹窗 ======
    function showConfirm(title, message, dangerMode) {
        return new Promise((resolve) => {
            const overlay = document.createElement('div');
            overlay.className = 'confirm-overlay';
            overlay.innerHTML =
                '<div class="confirm-card">' +
                    '<div class="confirm-title">' + title + '</div>' +
                    '<div class="confirm-message">' + message + '</div>' +
                    '<div class="confirm-actions">' +
                        '<button class="confirm-btn cancel">取消</button>' +
                        '<button class="confirm-btn ' + (dangerMode ? 'danger' : 'confirm') + '">确定</button>' +
                    '</div>' +
                '</div>';
            document.body.appendChild(overlay);
            const card = overlay.querySelector('.confirm-card');
            requestAnimationFrame(() => card.classList.add('show'));

            overlay.querySelector('.cancel').addEventListener('click', () => {
                overlay.remove();
                resolve(false);
            });
            overlay.querySelector('.confirm-btn:last-child').addEventListener('click', () => {
                overlay.remove();
                resolve(true);
            });
            overlay.addEventListener('click', (e) => {
                if (e.target === overlay) {
                    overlay.remove();
                    resolve(false);
                }
            });
        });
    }

    // ====== 在此启动隧道 ======
    async function handleStartProxy(proxyId, proxyName) {
        const ok = await showConfirm('启动隧道', '确定要启动隧道 "' + proxyName + '" 吗？\n将获取配置并通过 frpc 启动。');
        if (!ok) return;
        showToast('正在获取配置并启动...', 'info');
        try {
            const resp = await fetch('/api/startproxy', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ proxyId: proxyId })
            });
            const data = await resp.json();
            if (data.code === 200) {
                showToast('✅ 启动成功: ' + proxyName, 'success');
                loadProxyList(); // 刷新隧道状态
            } else {
                showToast('❌ ' + (data.message || '启动失败'), 'error');
            }
        } catch (e) {
            showToast('❌ 请求失败: ' + e.message, 'error');
        }
    }

    async function handleStopProxy(proxyId, proxyName) {
        const ok = await showConfirm('关闭隧道', '确定要关闭隧道 "' + proxyName + '" 吗？\n将停止 frpc 客户端。');
        if (!ok) return;
        showToast('正在关闭隧道...', 'info');
        try {
            const resp = await fetch('/api/stopproxy', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ proxyId: proxyId })
            });
            const data = await resp.json();
            if (data.code === 200) {
                showToast('✅ 已关闭: ' + proxyName, 'success');
                loadProxyList(); // 刷新隧道状态
            } else {
                showToast('❌ ' + (data.message || '关闭失败'), 'error');
            }
        } catch (e) {
            showToast('❌ 请求失败: ' + e.message, 'error');
        }
    }

    // 处理隧道操作
    async function handleProxyAction(action, proxyId, proxyName) {
        switch (action) {
            case 'start': {
                handleStartProxy(proxyId, proxyName);
                break;
            }
            case 'stop': {
                handleStopProxy(proxyId, proxyName);
                break;
            }
            case 'detail':
                showProxyDetail(proxyId);
                break;
            case 'edit':
                showEditProxyForm(proxyId);
                break;
            case 'kick': {
                const ok = await showConfirm('强制下线', '确定要强制下线隧道 "' + proxyName + '" 吗？', true);
                if (!ok) break;
                try {
                    const resp = await fetch('/api/kickproxy', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ proxyId: proxyId })
                    });
                    const data = await resp.json();
                    if (data.code === 200) {
                        showToast('已强制下线', 'success');
                        loadProxyList();
                    } else {
                        showToast(data.message || '操作失败', 'error');
                    }
                } catch (e) {
                    showToast('请求失败: ' + e.message, 'error');
                }
                break;
            }
            case 'toggle': {
                // 查找当前隧道的 isDisabled 状态
                const p = cachedProxies.find(x => x.proxyId === proxyId);
                const currentlyDisabled = p ? p.isDisabled : false;
                const title = currentlyDisabled ? '启用隧道' : '禁用隧道';
                const msg = currentlyDisabled
                    ? '确定要启用隧道 "' + proxyName + '" 吗？'
                    : '确定要禁用隧道 "' + proxyName + '" 吗？';
                const ok = await showConfirm(title, msg);
                if (!ok) break;
                try {
                    const resp = await fetch('/api/banunproxy', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ proxyId: proxyId, isDisabled: !currentlyDisabled })
                    });
                    const data = await resp.json();
                    if (data.code === 200) {
                        showToast(currentlyDisabled ? '已启用' : '已禁用', 'success');
                        loadProxyList();
                    } else {
                        showToast(data.message || '操作失败', 'error');
                    }
                } catch (e) {
                    showToast('请求失败: ' + e.message, 'error');
                }
                break;
            }
            case 'delete': {
                const ok = await showConfirm('删除隧道', '⚠️ 确定要删除隧道 "' + proxyName + '" 吗？此操作不可恢复！', true);
                if (!ok) break;
                try {
                    const resp = await fetch('/api/delproxy', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ proxyId: proxyId })
                    });
                    const data = await resp.json();
                    if (data.code === 200) {
                        showToast('已删除', 'success');
                        loadProxyList();
                    } else {
                        showToast(data.message || '操作失败', 'error');
                    }
                } catch (e) {
                    showToast('请求失败: ' + e.message, 'error');
                }
                break;
            }
        }
    }

    // ====== 编辑隧道弹窗 ======
    function showEditProxyForm(proxyId) {
        const p = cachedProxies.find(x => x.proxyId === proxyId);
        if (!p) {
            showToast('未找到隧道信息', 'error');
            return;
        }

        // 移除旧弹窗
        const oldModal = document.querySelector('.proxy-edit-modal');
        if (oldModal) oldModal.remove();

        // 解析 domain
        let domainVal = '';
        if (p.domain) {
            try {
                const arr = JSON.parse(p.domain);
                domainVal = Array.isArray(arr) ? arr.join(',') : p.domain;
            } catch (e) {
                domainVal = p.domain;
            }
        }

        const modal = document.createElement('div');
        modal.className = 'proxy-edit-modal';
        modal.innerHTML =
            '<div class="proxy-edit-overlay"></div>' +
            '<div class="proxy-edit-card">' +
                '<div class="proxy-edit-header">' +
                    '<div class="proxy-edit-title">编辑隧道 - ' + escapeHtml(p.proxyName) + '</div>' +
                    '<button class="proxy-edit-close" onclick="this.closest(\'.proxy-edit-modal\').remove()">' +
                        '<svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>' +
                    '</button>' +
                '</div>' +
                '<div class="proxy-edit-body">' +
                    '<div class="proxy-form">' +
                        '<div class="form-group">' +
                            '<label class="form-label">隧道名称</label>' +
                            '<input class="form-input" id="e_proxyName" value="' + escapeHtml(p.proxyName) + '" />' +
                        '</div>' +
                        '<div class="form-group">' +
                            '<label class="form-label">隧道类型</label>' +
                            '<select class="form-input" id="e_proxyType">' +
                                '<option value="tcp"' + (p.proxyType === 'tcp' ? ' selected' : '') + '>TCP</option>' +
                                '<option value="udp"' + (p.proxyType === 'udp' ? ' selected' : '') + '>UDP</option>' +
                                '<option value="http"' + (p.proxyType === 'http' ? ' selected' : '') + '>HTTP</option>' +
                                '<option value="https"' + (p.proxyType === 'https' ? ' selected' : '') + '>HTTPS</option>' +
                            '</select>' +
                        '</div>' +
                        '<div class="form-row">' +
                            '<div class="form-group">' +
                                '<label class="form-label">本地 IP</label>' +
                                '<input class="form-input" id="e_localIp" value="' + escapeHtml(p.localIp) + '" />' +
                            '</div>' +
                            '<div class="form-group">' +
                                '<label class="form-label">本地端口</label>' +
                                '<input class="form-input" id="e_localPort" type="number" value="' + p.localPort + '" />' +
                            '</div>' +
                        '</div>' +
                        '<div class="form-group">' +
                            '<label class="form-label">远程端口</label>' +
                            '<input class="form-input" id="e_remotePort" type="number" value="' + (p.remotePort || 0) + '" />' +
                        '</div>' +
                        '<div class="form-group">' +
                            '<label class="form-label">域名</label>' +
                            '<input class="form-input" id="e_domain" value="' + escapeHtml(domainVal) + '" placeholder="HTTP/HTTPS 类型" />' +
                        '</div>' +
                        '<div class="form-group">' +
                            '<label class="form-label">Host 头重写</label>' +
                            '<input class="form-input" id="e_hostHeaderRewrite" value="' + escapeHtml(p.hostHeaderRewrite || '') + '" />' +
                        '</div>' +
                        '<div class="form-row">' +
                            '<div class="form-group">' +
                                '<label class="form-checkbox"><input type="checkbox" id="e_useEncryption"' + (p.useEncryption ? ' checked' : '') + ' /> 启用加密</label>' +
                            '</div>' +
                            '<div class="form-group">' +
                                '<label class="form-checkbox"><input type="checkbox" id="e_useCompression"' + (p.useCompression ? ' checked' : '') + ' /> 启用压缩</label>' +
                            '</div>' +
                        '</div>' +
                        '<div class="form-group">' +
                            '<label class="form-label">Proxy Protocol</label>' +
                            '<input class="form-input" id="e_proxyProtocolVersion" value="' + escapeHtml(p.proxyProtocolVersion || '') + '" />' +
                        '</div>' +
                        '<div id="editResult" style="font-size:14px;color:var(--text-sec);"></div>' +
                        '<button class="btn-primary" id="saveEditBtn" type="button" style="width:100%;">保存修改</button>' +
                    '</div>' +
                '</div>' +
            '</div>';

        document.body.appendChild(modal);

        // 点击遮罩关闭
        modal.querySelector('.proxy-edit-overlay').addEventListener('click', () => modal.remove());

        // 入场动画
        requestAnimationFrame(() => {
            modal.querySelector('.proxy-edit-card').classList.add('show');
        });

        // 保存按钮事件
        document.getElementById('saveEditBtn').addEventListener('click', async () => {
            const newName = document.getElementById('e_proxyName').value.trim();
            if (!newName) {
                document.getElementById('editResult').textContent = '请输入隧道名称';
                document.getElementById('editResult').style.color = '#ff3b30';
                return;
            }

            const newType = document.getElementById('e_proxyType').value;
            const newLocalIp = document.getElementById('e_localIp').value.trim() || '127.0.0.1';
            const newLocalPort = parseInt(document.getElementById('e_localPort').value);
            if (!newLocalPort) {
                document.getElementById('editResult').textContent = '请输入本地端口';
                document.getElementById('editResult').style.color = '#ff3b30';
                return;
            }
            const newRemotePort = parseInt(document.getElementById('e_remotePort').value) || 0;
            const newDomain = document.getElementById('e_domain').value.trim();
            const newHostHeaderRewrite = document.getElementById('e_hostHeaderRewrite').value.trim();
            const newUseEncryption = document.getElementById('e_useEncryption').checked;
            const newUseCompression = document.getElementById('e_useCompression').checked;
            const newProxyProtocolVersion = document.getElementById('e_proxyProtocolVersion').value.trim();

            // domain 包装为 JSON 数组字符串
            let domainStr = newDomain || '';
            if (domainStr && !domainStr.startsWith('[')) {
                const domains = domainStr.split(',').map(d => d.trim()).filter(d => d);
                domainStr = JSON.stringify(domains);
            }

            const body = {
                proxyId: p.proxyId,
                proxyName: newName,
                proxyType: newType,
                localIp: newLocalIp,
                localPort: newLocalPort,
                remotePort: newRemotePort,
                nodeId: p.nodeId,
                domain: domainStr || '',
                location: p.location || '',
                accessKey: p.accessKey || '',
                securityMode: p.securityMode || 'none',
                httpPlugin: p.httpPlugin || '',
                hostHeaderRewrite: newHostHeaderRewrite || '',
                requestHeaders: p.requestHeaders || {},
                httpUser: p.httpUser || '',
                httpPassword: p.httpPassword || '',
                crtPath: p.crtPath || '',
                keyPath: p.keyPath || '',
                useEncryption: newUseEncryption,
                useCompression: newUseCompression,
                proxyProtocolVersion: newProxyProtocolVersion || '',
                transportProtocol: p.transportProtocol || p.proxyType || 'tcp',
                locations: p.locations || '',
                responseHeaders: p.responseHeaders || {}
            };

            const btn = document.getElementById('saveEditBtn');
            btn.textContent = '保存中...';
            btn.disabled = true;
            document.getElementById('editResult').textContent = '';

            try {
                const resp = await fetch('/api/updateproxy', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });
                const data = await resp.json();
                if (data.code === 200) {
                    document.getElementById('editResult').textContent = '✅ 更新成功！';
                    document.getElementById('editResult').style.color = '#34c759';
                    setTimeout(() => {
                        modal.remove();
                        loadProxyList();
                    }, 1000);
                } else {
                    document.getElementById('editResult').textContent = '❌ ' + (data.message || '更新失败');
                    document.getElementById('editResult').style.color = '#ff3b30';
                }
            } catch (e) {
                document.getElementById('editResult').textContent = '❌ 请求失败: ' + e.message;
                document.getElementById('editResult').style.color = '#ff3b30';
            }
            btn.textContent = '保存修改';
            btn.disabled = false;
        });
    }

    // 加载数据
    loadUserData();
    loadProxyList();
    loadNodeList();
    loadServerStatus();
</script>
